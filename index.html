<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020202">
<title>PLINKO — Jogo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020202;touch-action:none}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
#app{position:fixed;inset:0;overflow:hidden;background:#020202}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#game{z-index:2;touch-action:none}
#fx{z-index:3;pointer-events:none}
#hud{position:absolute;inset:0;z-index:6;pointer-events:none}
#hint{position:absolute;left:50%;top:5.2%;transform:translateX(-50%);white-space:nowrap;
font-size:clamp(10px,1.2vw,18px);font-weight:900;letter-spacing:.22em;color:#ffe5a0;
text-shadow:0 0 12px #ff9d16;opacity:.9}
#mode{position:absolute;right:3.2%;top:5.1%;display:flex;align-items:center;gap:7px;
font-size:10px;font-weight:900;letter-spacing:.14em;color:#d9b86d}
#mode i{width:7px;height:7px;border-radius:50%;background:#4cff91;box-shadow:0 0 10px #4cff91}
#result{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%) scale(.86);opacity:0;
min-width:min(360px,82vw);padding:18px 28px;text-align:center;border:2px solid #ffd45d;border-radius:14px;
background:rgba(4,3,2,.97);box-shadow:0 0 40px #ff9500,inset 0 0 30px rgba(255,180,30,.15);transition:.25s}
#result.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#result small{display:block;font-size:11px;letter-spacing:.25em;color:#ffd86e;font-weight:900}
#result strong{display:block;margin-top:7px;font-size:clamp(25px,4vw,48px);line-height:1.05}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<canvas id="fx"></canvas>
<div id="hud">
  <div id="hint">TOQUE • ARRASTE • SOLTE</div>
  <div id="mode"><i></i> AO VIVO</div>
</div>
<div id="result"><small>SEU PRÊMIO</small><strong id="resultText"></strong></div>
</div>

<script>
(()=>{"use strict";

const C=document.getElementById("game"),ctx=C.getContext("2d");
const FX=document.getElementById("fx"),fx=FX.getContext("2d");
const hint=document.getElementById("hint"),result=document.getElementById("result"),resultText=document.getElementById("resultText");

const PRIZES=[
"R$ 100 FICHAS","R$ 200 FICHAS","R$ 500 FICHAS","R$ 1.000 FICHAS","R$ 2.000 FICHAS","R$ 5.000 FICHAS",
"iPad","iPhone 17 Pro Max","Bicicleta Elétrica","Barra de Ouro","10 CUPONS CARRO","15 CUPONS CARRO","20 CUPONS CARRO"
];

let W,H,D,mobile=false,board={},pegs=[],ball=null,state="ready",pointerId=null;
let last=0,acc=0,raf=0,win=-1,winUntil=0,particles=[],hitFlash=0,selectedX=0;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

function fit(){
 W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);mobile=W<700||H>W*1.15;
 for(const c of [C,FX]){c.width=W*D;c.height=H*D;c.style.width=W+"px";c.style.height=H+"px"}
 ctx.setTransform(D,0,0,D,0,0);fx.setTransform(D,0,0,D,0,0);

 /* Em retrato o tabuleiro recebe quase toda a largura útil e os prêmios ficam
    imediatamente abaixo. Em paisagem ele preserva a composição 16:9. */
 if(mobile) board={cx:W/2,top:H*.25,bottom:H*.705,topHalf:W*.22,bottomHalf:W*.455};
 else {const s=Math.min(W/1536,H/864);board={cx:W/2,top:H*.185,bottom:H*.765,topHalf:212*s,bottomHalf:535*s}}
 buildPegs();
 if(ball&&state==="drag"){ball.y=board.top+28;ball.r=mobile?5.5:8.5}
 draw();
}

function buildPegs(){
 pegs=[];
 const rows=mobile?10:10;
 const top=board.top+55,bottom=board.bottom-66;
 const gap=mobile?Math.min(W*.082,34):Math.min(W*.046,67);
 for(let r=0;r<rows;r++){
   const n=7+r;
   const y=lerp(top,bottom,r/(rows-1));
   /* ESCALONAMENTO: fileiras alternadas. Isso elimina corredores verticais
      e, principalmente, evita a bola ficar apoiada em dois pinos. */
   const offset=(r%2)?gap/2:0;
   const start=board.cx-((n-1)*gap)/2+offset;
   for(let i=0;i<n;i++)pegs.push({x:start+i*gap,y,r:mobile?3.25:5.0});
 }
}

function bg(){
 ctx.clearRect(0,0,W,H);
 const g=ctx.createRadialGradient(W*.5,H*.38,5,W*.5,H*.45,Math.max(W,H)*.75);
 g.addColorStop(0,"#19120a");g.addColorStop(.25,"#0a0806");g.addColorStop(.7,"#030303");g.addColorStop(1,"#000");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 /* Sem cortinas. Em vez delas: arquitetura escura de palco + linhas douradas. */
 const sideW=mobile?W*.035:W*.045;
 for(const side of [-1,1]){
   const x=side<0?0:W-sideW;
   const lg=ctx.createLinearGradient(x,0,x+sideW,0);
   lg.addColorStop(0,"#070604");lg.addColorStop(.4,"#6e430b");lg.addColorStop(.52,"#f3c75a");lg.addColorStop(.7,"#4d2c07");lg.addColorStop(1,"#050403");
   ctx.fillStyle=lg;ctx.fillRect(x,0,sideW,H*.8);
   for(let y=24;y<H*.72;y+=mobile?48:34) bulb(x+sideW/2,y,mobile?2.2:3.5);
 }
 /* molduras horizontais discretas */
 ctx.strokeStyle="rgba(255,188,66,.11)";ctx.lineWidth=1;
 for(const y of [H*.09,H*.82]){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}

function bulb(x,y,r){
 ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle="#fff0a6";ctx.shadowColor="#ffad18";ctx.shadowBlur=10;ctx.fill();ctx.restore()
}

function header(){
 const fs=mobile?Math.min(W*.10,46):Math.min(W*.058,88);
 ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`1000 ${fs}px Arial`;
 ctx.fillStyle="#ffd35a";ctx.shadowColor="#ff9900";ctx.shadowBlur=22;ctx.fillText("PLINKO",W/2,fs*.7);
 ctx.fillStyle="#ffdc70";ctx.shadowBlur=7;ctx.fillText("PLINKO",W/2,fs*.66);ctx.restore();
 /* linha fina abaixo do título */
 ctx.save();ctx.strokeStyle="rgba(255,204,90,.45)";ctx.lineWidth=1;ctx.beginPath();
 ctx.moveTo(W*.37,fs*1.08);ctx.lineTo(W*.63,fs*1.08);ctx.stroke();ctx.restore();
}

function boardDraw(){
 const t=board.top,b=board.bottom,L=board.cx-board.topHalf,R=board.cx+board.topHalf;
 const BL=board.cx-board.bottomHalf,BR=board.cx+board.bottomHalf;
 const g=ctx.createLinearGradient(0,t,0,b);g.addColorStop(0,"#0e0e0c");g.addColorStop(.55,"#050505");g.addColorStop(1,"#010101");

 ctx.save();
 ctx.beginPath();ctx.moveTo(L,t);ctx.lineTo(R,t);ctx.lineTo(BR,b);ctx.lineTo(BL,b);ctx.closePath();
 ctx.fillStyle=g;ctx.fill();
 ctx.lineJoin="round";ctx.lineWidth=mobile?7:15;ctx.strokeStyle="#6f4108";ctx.shadowColor="#ff9e18";ctx.shadowBlur=22;ctx.stroke();
 ctx.lineWidth=mobile?3:5;ctx.strokeStyle="#ffd45a";ctx.shadowBlur=7;ctx.stroke();ctx.restore();

 const count=mobile?10:16;
 for(let i=0;i<count;i++){const q=i/(count-1);bulb(lerp(L,BL,q),lerp(t,b,q),mobile?2:3.8);bulb(lerp(R,BR,q),lerp(t,b,q),mobile?2:3.8)}
 [board.cx-(mobile?45:92),board.cx,board.cx+(mobile?45:92)].forEach(x=>arrow(x,t+12,mobile?12:20));
}

function arrow(x,y,s){
 ctx.save();ctx.strokeStyle="#ff2039";ctx.lineWidth=mobile?2.4:4;ctx.lineCap="round";ctx.shadowColor="#ff1730";ctx.shadowBlur=12;
 ctx.beginPath();ctx.moveTo(x-s,y);ctx.lineTo(x,y+s);ctx.lineTo(x+s,y);ctx.stroke();
 ctx.beginPath();ctx.moveTo(x-s,y+s*.75);ctx.lineTo(x,y+s*1.75);ctx.lineTo(x+s,y+s*.75);ctx.stroke();ctx.restore();
}

function pegsDraw(){
 for(const p of pegs){
   ctx.save();
   ctx.beginPath();ctx.arc(p.x,p.y,p.r+2.3,0,Math.PI*2);ctx.fillStyle="rgba(255,170,24,.10)";ctx.fill();
   const g=ctx.createRadialGradient(p.x-p.r*.45,p.y-p.r*.45,1,p.x,p.y,p.r);
   g.addColorStop(0,"#fff4bd");g.addColorStop(.35,"#ffd24e");g.addColorStop(1,"#814200");
   ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=g;ctx.shadowColor="#ffad19";ctx.shadowBlur=mobile?4:7;ctx.fill();ctx.restore();
 }
}

function prizeLabel(s){
 if(s==="iPhone 17 Pro Max")return["iPhone","17 Pro Max"];
 if(s==="Bicicleta Elétrica")return["Bicicleta","Elétrica"];
 if(s==="Barra de Ouro")return["Barra","de Ouro"];
 if(s.includes("CUPONS")){let a=s.split(" ");return[a[0]+" "+a[1],"CUPONS","CARRO"]}
 if(s.startsWith("R$ "))return[s.replace(" FICHAS",""),"FICHAS"];
 return[s];
}
function prizesDraw(){
 const top=board.bottom-2,h=H-top,L=mobile?W*.015:W*.12,R=mobile?W*.985:W*.88,bw=(R-L)/13;
 for(let i=0;i<13;i++){
   const x=L+i*bw;
   const grad=ctx.createLinearGradient(0,top,0,H);
   if(i<6||i>=10){grad.addColorStop(0,i%2?"#f28d28":"#ef1f35");grad.addColorStop(1,i%2?"#984006":"#970515")}
   else{grad.addColorStop(0,"#25132f");grad.addColorStop(1,"#08030d")}
   ctx.fillStyle=grad;ctx.fillRect(x,top,bw-1,h);
   ctx.strokeStyle=i===win?"#fff1a0":"#17100a";ctx.lineWidth=i===win?3:1;ctx.strokeRect(x,top,bw-1,h);
   const icon=["◉","◉","◉","◉","◉","◉","▯","▯","♢","▱","●","●","●"][i];
   ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`bold ${mobile?15:27}px Arial`;
   ctx.fillStyle="#fff0a0";ctx.shadowColor="#ffb11d";ctx.shadowBlur=7;ctx.fillText(icon,x+bw/2,top+h*.23);ctx.restore();
   const fs=mobile?Math.max(7,Math.min(10,W*.017)):13;
   ctx.save();ctx.textAlign="center";ctx.textBaseline="top";ctx.font=`1000 ${fs}px Arial`;ctx.fillStyle="#fff";ctx.shadowColor="#000";ctx.shadowBlur=3;
   prizeLabel(PRIZES[i]).forEach((s,j)=>ctx.fillText(s,x+bw/2,top+h*.52+j*(fs+2)));ctx.restore();
 }
}

function ballDraw(){
 if(!ball)return;
 const r=ball.r,g=ctx.createRadialGradient(ball.x-r*.45,ball.y-r*.5,1,ball.x,ball.y,r*1.15);
 g.addColorStop(0,"#fff");g.addColorStop(.28,"#fff");g.addColorStop(.62,"#d9dcdf");g.addColorStop(1,"#666c71");
 ctx.save();ctx.beginPath();ctx.arc(ball.x,ball.y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.shadowColor="#fff";ctx.shadowBlur=mobile?8:13;ctx.fill();ctx.restore();

 if(state==="drag"){
   ctx.save();ctx.strokeStyle="rgba(255,215,105,.65)";ctx.lineWidth=1.2;ctx.setLineDash([5,6]);
   ctx.beginPath();ctx.moveTo(ball.x,ball.y+r+5);ctx.lineTo(ball.x,board.top+58);ctx.stroke();ctx.restore();
 }
}

function effects(){
 fx.clearRect(0,0,W,H);
 if(win>=0&&performance.now()<winUntil){
   const L=mobile?W*.015:W*.12,R=mobile?W*.985:W*.88,bw=(R-L)/13,cx=L+(win+.5)*bw;
   const p=.5+.5*Math.sin(performance.now()/90),g=fx.createRadialGradient(cx,board.bottom+35,1,cx,board.bottom+35,80);
   g.addColorStop(0,`rgba(255,220,70,${.5+.2*p})`);g.addColorStop(1,"rgba(255,100,0,0)");
   fx.fillStyle=g;fx.fillRect(cx-100,board.bottom-20,200,150);
 }
 for(const q of particles){
   q.life-=.016;q.x+=q.vx*.016;q.y+=q.vy*.016;q.vy+=300*.016;
   fx.globalAlpha=Math.max(0,q.life);fx.fillStyle=q.color;fx.beginPath();fx.arc(q.x,q.y,q.r,0,Math.PI*2);fx.fill();
 }
 fx.globalAlpha=1;particles=particles.filter(q=>q.life>0);
}

function draw(){bg();header();boardDraw();pegsDraw();prizesDraw();ballDraw();effects()}

function start(x){
 ball={x:clamp(x,board.cx-board.topHalf+8,board.cx+board.topHalf-8),y:board.top+42,vx:0,vy:0,r:mobile?5.5:8.5,age:0};
 state="drag";selectedX=ball.x;win=-1;draw();
}

function hitParticles(x,y){
 for(let i=0;i<5;i++)particles.push({x,y,vx:(Math.random()-.5)*80,vy:-Math.random()*80,r:1+Math.random()*1.5,life:.25+Math.random()*.2,color:"#ffd45c"});
}

function finish(){
 if(state!=="fall")return;
 state="result";
 const L=mobile?W*.015:W*.12,R=mobile?W*.985:W*.88,bw=(R-L)/13;
 win=clamp(Math.floor((ball.x-L)/bw),0,12);winUntil=performance.now()+2600;
 resultText.textContent=PRIZES[win];result.classList.add("show");hint.textContent="PRÊMIO SORTEADO";draw();
 setTimeout(()=>{result.classList.remove("show");ball=null;state="ready";win=-1;hint.textContent="TOQUE • ARRASTE • SOLTE";draw()},2600);
}

function step(dt){
 if(!ball)return;
 ball.age+=dt;
 /* Gravidade e velocidade controladas. A bola nunca recebe um alvo de prêmio. */
 ball.vy+=900*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;

 const t=clamp((ball.y-(board.top+40))/(board.bottom-board.top-40),0,1);
 const left=lerp(board.cx-board.topHalf,board.cx-board.bottomHalf,t);
 const right=lerp(board.cx+board.topHalf,board.cx+board.bottomHalf,t);
 const pad=ball.r+1;

 if(ball.x<left+pad){ball.x=left+pad;ball.vx=Math.abs(ball.vx)*.74}
 if(ball.x>right-pad){ball.x=right-pad;ball.vx=-Math.abs(ball.vx)*.74}

 /* Solver robusto:
    - bola bem menor que o espaçamento
    - detecção contínua em substeps
    - restituição moderada
    - pequenas perdas de energia
    Assim ela passa por TODOS os corredores sem ficar "encaixada". */
 for(let pass=0;pass<2;pass++){
   for(const p of pegs){
     const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy),min=ball.r+p.r;
     if(d<min){
       const nx=dx/(d||1),ny=dy/(d||1),over=min-d;
       ball.x+=nx*(over+.35);ball.y+=ny*(over+.35);
       const vn=ball.vx*nx+ball.vy*ny;
       if(vn<0){
         ball.vx-=1.38*vn*nx;ball.vy-=1.38*vn*ny;
         const tx=-ny,ty=nx,vt=ball.vx*tx+ball.vy*ty;
         ball.vx-=vt*tx*.025;ball.vy-=vt*ty*.025;
         hitParticles(ball.x,ball.y);
       }
     }
   }
 }
 ball.vx*=.999;

 if(ball.y>board.bottom-6){
   const L=mobile?W*.015:W*.12,R=mobile?W*.985:W*.88,bw=(R-L)/13;
   const idx=clamp(Math.floor((ball.x-L)/bw),0,12),l=L+idx*bw,r=l+bw;
   if(ball.x<l+ball.r){ball.x=l+ball.r;ball.vx=Math.abs(ball.vx)*.15}
   if(ball.x>r-ball.r){ball.x=r-ball.r;ball.vx=-Math.abs(ball.vx)*.15}
 }
 if(ball.y>board.bottom+H*.09){
   ball.y=board.bottom+H*.09;ball.vy=0;ball.vx*=.35;
   if(Math.abs(ball.vx)<4)finish();
 }
 if(ball.age>8)finish();
}

function loop(now){
 const elapsed=Math.min(.035,(now-last)/1000);last=now;acc+=elapsed;
 const fixed=1/240;let n=0;
 while(acc>=fixed&&n++<24){step(fixed);acc-=fixed}
 draw();
 if(state==="fall")raf=requestAnimationFrame(loop);
}

function point(e){
 const r=document.getElementById("app").getBoundingClientRect();
 return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}
}
function down(e){
 e.preventDefault();if(state==="fall")return;
 const p=point(e);
 if(p.y>=board.top-35&&p.y<=board.top+95){
   pointerId=e.pointerId;C.setPointerCapture?.(pointerId);start(p.x);
 }
}
function move(e){
 if(pointerId!==e.pointerId||state!=="drag")return;
 e.preventDefault();const p=point(e);
 ball.x=clamp(p.x,board.cx-board.topHalf+8,board.cx+board.topHalf-8);selectedX=ball.x;draw();
}
function up(e){
 if(pointerId!==e.pointerId)return;e.preventDefault();pointerId=null;
 if(state!=="drag")return;
 state="fall";ball.vy=18;ball.vx=(Math.random()-.5)*7;
 hint.textContent="A BOLA ESTÁ DESCENDO...";
 last=performance.now();acc=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
C.addEventListener("pointerdown",down,{passive:false});
C.addEventListener("pointermove",move,{passive:false});
C.addEventListener("pointerup",up,{passive:false});
C.addEventListener("pointercancel",up,{passive:false});
addEventListener("resize",fit);addEventListener("orientationchange",()=>setTimeout(fit,100));
fit();start(board.cx);
})();
</script>
</body>
</html>
