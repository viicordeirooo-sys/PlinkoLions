<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Plinko</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131d}
  body{font-family:Arial,Helvetica,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  #game{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
  #hint{
    position:fixed;left:50%;top:18px;transform:translateX(-50%);
    padding:8px 14px;border-radius:999px;
    background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);
    color:rgba(255,255,255,.65);font-size:12px;letter-spacing:.08em;
    opacity:.8;transition:opacity .35s;pointer-events:none
  }
  #result{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);
    min-width:min(520px,82vw);padding:22px 30px;text-align:center;
    border-radius:18px;background:rgba(8,10,14,.94);
    border:2px solid #e7b94f;box-shadow:0 18px 80px rgba(0,0,0,.65);
    color:white;opacity:0;pointer-events:none;transition:.25s ease
  }
  #result.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #result .small{font-size:13px;letter-spacing:.18em;color:#d8b05a;text-transform:uppercase}
  #result .big{font-size:clamp(28px,5vw,64px);font-weight:900;margin-top:7px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">TOQUE · ARRASTE · SOLTE</div>
<div id="result"><div class="small">Prêmio</div><div class="big" id="resultText"></div></div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<script>
(() => {
  const {Engine, World, Bodies, Body, Events} = Matter;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const result = document.getElementById('result');
  const resultText = document.getElementById('resultText');

  // Ordem dos resultados, da esquerda para a direita.
  const PRIZES = [
    'R$ 1.000', 'R$ 500', 'R$ 200', 'R$ 100',
    '20 CUPONS', '15 CUPONS', '10 CUPONS',
    'R$ 100', '10 CUPONS', '15 CUPONS', '20 CUPONS',
    'R$ 100', 'R$ 200', 'R$ 500', 'R$ 1.000'
  ];

  const engine = Engine.create({enableSleeping:false});
  engine.gravity.y = 1.18;
  engine.positionIterations = 10;
  engine.velocityIterations = 8;
  engine.constraintIterations = 4;

  let W=0,H=0,dpr=1;
  let boardLeft=0, boardRight=0, boardTop=0, boardBottom=0;
  let slotY=0, slotH=0, slotW=0;
  let pegs=[];
  let separators=[];
  let ball=null;
  let ballReleased=false;
  let dragging=false;
  let pointerX=0;
  let roundLocked=false;
  let lastTime=performance.now();
  let settleTimer=null;

  const palette = {
    bg:'#07131d', peg:'#f2f2f2', pegGlow:'rgba(255,255,255,.16)',
    red:'#ef3340', gold:'#e8b84e', orange:'#ef9c3a', dark:'#0b1118',
    slotText:'#101419'
  };

  function clearWorld(){
    World.clear(engine.world, false);
    pegs=[]; separators=[]; ball=null; ballReleased=false; dragging=false;
  }

  function resize(){
    const rect=canvas.getBoundingClientRect();
    W=rect.width; H=rect.height; dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.floor(W*dpr));
    canvas.height=Math.max(1,Math.floor(H*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);

    clearWorld();

    // Board occupies almost the entire screen; intentionally minimal UI.
    const side=Math.min(W*.055,72);
    boardLeft=side;
    boardRight=W-side;
    boardTop=Math.max(56,H*.055);
    boardBottom=H-Math.max(105,H*.13);

    const boardW=boardRight-boardLeft;
    slotW=boardW/PRIZES.length;
    slotY=boardBottom+10;
    slotH=Math.max(72,H-slotY-18);

    buildBoard();
  }

  function buildBoard(){
    const boardW=boardRight-boardLeft;
    const cx=(boardLeft+boardRight)/2;

    // Invisible side walls.
    World.add(engine.world, [
      Bodies.rectangle(boardLeft-16,(boardTop+boardBottom)/2,32,boardBottom-boardTop+160,
        {isStatic:true,label:'wall'}),
      Bodies.rectangle(boardRight+16,(boardTop+boardBottom)/2,32,boardBottom-boardTop+160,
        {isStatic:true,label:'wall'})
    ]);

    // Peg field. Each row alternates by half a spacing so the ball always
    // has multiple natural collision paths.
    const rows=12;
    const spacingX=Math.min(slotW*.72,52);
    const spacingY=Math.min((boardBottom-boardTop)*.078,52);
    const firstY=boardTop+70;

    for(let r=0;r<rows;r++){
      const y=firstY+r*spacingY;
      const offset=(r%2 ? spacingX/2 : 0);
      const usable=boardW-26;
      const count=Math.floor(usable/spacingX)+1;
      const start=cx-(count-1)*spacingX/2+offset;

      for(let i=0;i<count;i++){
        const x=start+i*spacingX;
        if(x>boardLeft+15 && x<boardRight-15 && y<boardBottom-45){
          const peg=Bodies.circle(x,y,5.6,{
            isStatic:true,
            restitution:.42,
            friction:.04,
            label:'peg'
          });
          pegs.push(peg);
        }
      }
    }
    World.add(engine.world,pegs);

    // Bottom funnels: slightly sloped guides before the bins.
    const funnelY=boardBottom-18;
    const guideH=10;
    const guideAngle=Math.PI/8;
    const guideLen=Math.min(90,slotW*1.45);
    for(let i=0;i<PRIZES.length-1;i++){
      const x=boardLeft+slotW*(i+1);
      const left=Bodies.rectangle(x-guideLen*.32,funnelY,guideLen,guideH,
        {isStatic:true,angle:guideAngle,label:'guide'});
      const right=Bodies.rectangle(x+guideLen*.32,funnelY,guideLen,guideH,
        {isStatic:true,angle:-guideAngle,label:'guide'});
      // Only use the pair when it stays in its local region; these are
      // shallow visual/physical funnels and don't seal the bins.
      World.add(engine.world,[left,right]);
    }

    // Bin separators. The actual prize is determined by the bin in which
    // the ball crosses the scoring line.
    const sepTop=boardBottom+2;
    const sepBottom=H+30;
    for(let i=0;i<=PRIZES.length;i++){
      const x=boardLeft+i*slotW;
      const wall=Bodies.rectangle(x, (sepTop+sepBottom)/2, 5, sepBottom-sepTop,
        {isStatic:true,label:'separator'});
      separators.push(wall);
    }
    World.add(engine.world,separators);

    // Floor below the bins.
    World.add(engine.world,Bodies.rectangle((boardLeft+boardRight)/2,H+18,boardW+20,36,
      {isStatic:true,label:'floor'}));
  }

  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

  function makeBall(x){
    if(roundLocked || ball) return;
    const y=boardTop+22;
    ball=Bodies.circle(x,y,5.8,{

      restitution:.38,
      friction:.018,
      frictionAir:.0022,
      density:.0022,
      label:'ball',
      sleepThreshold:Infinity
    });
    Body.setVelocity(ball,{x:0,y:0});
    World.add(engine.world,ball);
  }

  function releaseBall(){
    if(!ball || ballReleased || roundLocked) return;
    ballReleased=true;
    dragging=false;
    hint.style.opacity='.12';

    // Tiny, deterministic-free nudge only to prevent a perfectly vertical
    // deadlock. The physics engine decides every subsequent collision.
    Body.setVelocity(ball,{x:(Math.random()-.5)*.22,y:.35});
    Body.setAngularVelocity(ball,(Math.random()-.5)*.04);
  }

  function pointerPos(e){
    const r=canvas.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  }

  canvas.addEventListener('pointerdown',e=>{
    if(roundLocked) return;
    e.preventDefault();
    canvas.setPointerCapture?.(e.pointerId);
    const p=pointerPos(e);
    pointerX=clamp(p.x,boardLeft+15,boardRight-15);

    if(!ball) makeBall(pointerX);
    if(ball && !ballReleased){
      dragging=true;
      Body.setPosition(ball,{x:pointerX,y:boardTop+22});
      Body.setVelocity(ball,{x:0,y:0});
    }
  },{passive:false});

  canvas.addEventListener('pointermove',e=>{
    if(!dragging || !ball || ballReleased || roundLocked) return;
    e.preventDefault();
    const p=pointerPos(e);
    pointerX=clamp(p.x,boardLeft+15,boardRight-15);
    Body.setPosition(ball,{x:pointerX,y:boardTop+22});
    Body.setVelocity(ball,{x:0,y:0});
  },{passive:false});

  function pointerup(e){
    if(!dragging) return;
    e.preventDefault();
    releaseBall();
  }
  canvas.addEventListener('pointerup',pointerup,{passive:false});
  canvas.addEventListener('pointercancel',pointerup,{passive:false});

  // If the ball crosses the scoring line, lock in the actual bin.
  Events.on(engine,'afterUpdate',()=>{
    if(!ball || !ballReleased) return;

    if(ball.position.y > boardBottom+18 && !roundLocked){
      const idx=clamp(Math.floor((ball.position.x-boardLeft)/slotW),0,PRIZES.length-1);
      // Don't award until the ball has actually settled into the bin.
      if(ball.position.y > H-28 || (Math.abs(ball.velocity.y)<.18 && ball.position.y>boardBottom+28)){ 
        finishRound(idx);
      }
    }

    // Safety: if physics sends it outside the board, reset without changing
    // the visual outcome.
    if(ball.position.y>H+100){
      const idx=clamp(Math.floor((ball.position.x-boardLeft)/slotW),0,PRIZES.length-1);
      finishRound(idx);
    }
  });

  function finishRound(idx){
    if(roundLocked) return;
    roundLocked=true;
    const prize=PRIZES[idx];
    resultText.textContent=prize;
    result.classList.add('show');

    clearTimeout(settleTimer);
    settleTimer=setTimeout(()=>{
      result.classList.remove('show');
      roundLocked=false;
      World.remove(engine.world,ball);
      ball=null;
      ballReleased=false;
      hint.style.opacity='.8';
    },1800);
  }

  function drawBackground(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#091722');
    g.addColorStop(.6,'#07131d');
    g.addColorStop(1,'#050d14');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    // Very subtle vignette; no decorative UI.
    const vg=ctx.createRadialGradient(W/2,H*.42,Math.min(W,H)*.08,W/2,H*.42,Math.max(W,H)*.72);
    vg.addColorStop(0,'rgba(255,255,255,.035)');
    vg.addColorStop(1,'rgba(0,0,0,.35)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  }

  function drawPegs(){
    for(const p of pegs){
      ctx.beginPath();ctx.arc(p.position.x,p.position.y,10,0,Math.PI*2);
      ctx.fillStyle=palette.pegGlow;ctx.fill();
      ctx.beginPath();ctx.arc(p.position.x,p.position.y,5.6,0,Math.PI*2);
      ctx.fillStyle=palette.peg;ctx.fill();
    }
  }

  function roundRect(x,y,w,h,r){
    const rr=Math.min(r,w/2,h/2);
    ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();
  }

  function drawSlots(){
    const y=slotY+4, h=slotH-7;
    for(let i=0;i<PRIZES.length;i++){
      const x=boardLeft+i*slotW+2;
      const w=slotW-4;
      const hot=(i===Math.floor(PRIZES.length/2));
      ctx.fillStyle=hot?'#efb044':(i%2?'#ef8f35':'#e93340');
      roundRect(x,y,w,h,7);ctx.fill();

      ctx.fillStyle='rgba(0,0,0,.18)';
      ctx.fillRect(x,y+h-6,w,6);

      ctx.fillStyle=palette.slotText;
      ctx.font=`900 ${Math.max(11,Math.min(18,slotW*.22))}px Arial`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      const lines=PRIZES[i].split(' ');
      let label=PRIZES[i];
      if(slotW<72 && PRIZES[i].includes('CUPONS')){
        label=PRIZES[i].replace(' CUPONS','');
      }
      ctx.fillText(label,x+w/2,y+h/2);
    }
  }

  function drawBall(){
    if(!ball)return;
    const x=ball.position.x,y=ball.position.y;
    const rg=ctx.createRadialGradient(x-2,y-2.5,0.5,x,y,6.2);
    rg.addColorStop(0,'#ffffff');rg.addColorStop(.35,'#d9dde0');rg.addColorStop(1,'#70777c');
    ctx.beginPath();ctx.arc(x,y,5.8,0,Math.PI*2);ctx.fillStyle=rg;ctx.fill();
    ctx.beginPath();ctx.arc(x-1.7,y-2,1.5,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.7)';ctx.fill();
  }

  function drawReleaseBall(){
    if(ballReleased || !ball) return;
    const x=ball.position.x,y=boardTop+22;
    ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fillStyle='rgba(239,51,64,.12)';ctx.fill();
    ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fillStyle=palette.red;ctx.fill();
  }

  function render(){
    drawBackground();
    drawPegs();
    drawSlots();
    drawReleaseBall();
    drawBall();
  }

  function loop(t){
    const dt=Math.min(33,t-lastTime);lastTime=t;
    if(!roundLocked) Engine.update(engine,dt);
    render();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize',resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
