<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PLINKO</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020202;touch-action:none}
body{font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;color:white}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#050505}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#game{z-index:2;touch-action:none}
#fx{z-index:3;pointer-events:none}
#vignette{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.62) 100%)}
#status{position:absolute;z-index:6;left:50%;top:17.5%;transform:translateX(-50%);font-weight:900;
font-size:clamp(11px,1.15vw,22px);letter-spacing:.16em;color:#ffe39a;text-shadow:0 0 9px #ff9a00;
opacity:.95;pointer-events:none;white-space:nowrap}
#result{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
opacity:0;pointer-events:none;text-align:center;padding:22px 36px;border-radius:14px;
border:2px solid #ffd05a;background:rgba(8,4,2,.95);box-shadow:0 0 35px #ff9700,inset 0 0 30px rgba(255,180,0,.18);transition:.28s}
#result.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#result small{display:block;color:#ffd56d;font-size:13px;letter-spacing:.2em;font-weight:900}
#result strong{display:block;margin-top:8px;font-size:clamp(26px,3vw,52px);color:#fff}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas><canvas id="fx"></canvas><div id="vignette"></div>
<div id="status">TOQUE • ARRASTE • SOLTE</div>
<div id="result"><small>SEU PRÊMIO</small><strong id="resultText"></strong></div>
</div>

<script>
(() => {
"use strict";

/* PLINKO — implementação independente da referência visual.
   A imagem de referência NÃO é usada como fundo.
   Tudo abaixo é desenhado pelo Canvas e a bola usa física real.
*/

const C=document.getElementById("game"), X=C.getContext("2d");
const F=document.getElementById("fx"), FX=F.getContext("2d");
const status=document.getElementById("status"), result=document.getElementById("result"), resultText=document.getElementById("resultText");

const P=[
"R$ 100 FICHAS","R$ 200 FICHAS","R$ 500 FICHAS","R$ 1.000 FICHAS","R$ 2.000 FICHAS","R$ 5.000 FICHAS",
"iPad","iPhone 17 Pro Max","Bicicleta Elétrica","Barra de Ouro","10 CUPONS CARRO","15 CUPONS CARRO","20 CUPONS CARRO"
];

const S={w:1536,h:864,s:1,ox:0,oy:0,dpr:1};
let pegs=[],ball=null,state="ready",pointer=false,last=0,acc=0,win=-1,winTimer=0,raf=0;

function resize(){
 S.dpr=Math.min(devicePixelRatio||1,2);
 const W=innerWidth,H=innerHeight;
 S.s=Math.min(W/1536,H/864); S.w=W;S.h=H;S.ox=(W-1536*S.s)/2;S.oy=(H-864*S.s)/2;
 for(const c of [C,F]){c.width=W*S.dpr;c.height=H*S.dpr;c.style.width=W+"px";c.style.height=H+"px"}
 X.setTransform(S.dpr,0,0,S.dpr,0,0);FX.setTransform(S.dpr,0,0,S.dpr,0,0);
 buildPegs();draw();
}
function sc(x,y){return [S.ox+x*S.s,S.oy+y*S.s]}
function bs(clientX,clientY){return [(clientX-S.ox)/S.s,(clientY-S.oy)/S.s]}
function clamp(a,b,c){return Math.max(b,Math.min(c,a))}

function buildPegs(){
 pegs=[];
 /* Formação triangular real, igual à referência: poucas linhas no topo,
    aumentando progressivamente até a base. */
 const rows=10, top=263, dy=42.5, center=768;
 for(let r=0;r<rows;r++){
   const n=7+r;
   const gap=70.5;
   const y=top+r*dy;
   const start=center-(n-1)*gap/2;
   for(let i=0;i<n;i++) pegs.push({x:start+i*gap,y,r:6.2});
 }
}

function roundRect(c,x,y,w,h,r){
 c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
 c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
function glowText(text,x,y,size,color,align="center"){
 X.save();X.textAlign=align;X.textBaseline="middle";X.font=`1000 ${size}px Arial`;
 X.fillStyle=color;X.shadowColor="#ff9b12";X.shadowBlur=14;X.fillText(text,x,y);X.shadowBlur=3;X.fillText(text,x,y);X.restore();
}
function drawStage(){
 X.clearRect(0,0,S.w,S.h);
 X.fillStyle="#020303";X.fillRect(0,0,S.w,S.h);

 // palco / luzes
 const bg=X.createRadialGradient(S.ox+768*S.s,S.oy+290*S.s,20,S.ox+768*S.s,S.oy+400*S.s,650*S.s);
 bg.addColorStop(0,"#241308");bg.addColorStop(.38,"#0d0907");bg.addColorStop(1,"#010101");
 X.fillStyle=bg;X.fillRect(0,0,S.w,S.h);

 // colunas laterais douradas
 for(const side of [-1,1]){
   const cx=S.ox+(side<0?75:1461)*S.s;
   X.save();X.globalAlpha=.8;
   const g=X.createLinearGradient(cx-25*S.s,0,cx+25*S.s,0);
   g.addColorStop(0,"#2d1605");g.addColorStop(.35,"#ffd45c");g.addColorStop(.5,"#8c4d0a");g.addColorStop(.72,"#ffe28a");g.addColorStop(1,"#170a02");
   X.fillStyle=g;X.fillRect(cx-17*S.s,S.oy,cx+17*S.s,864*S.s);
   for(let y=35;y<650;y+=35){bulb(cx,y)}
   X.restore();
 }
 // cortinas
 curtain(-1);curtain(1);

 // fachos
 lightBeam(470,0,590,350);lightBeam(1065,0,945,350);

 // piso
 const floor=X.createLinearGradient(0,S.oy+720*S.s,0,S.oy+864*S.s);
 floor.addColorStop(0,"#080604");floor.addColorStop(1,"#000");
 X.fillStyle=floor;X.fillRect(0,S.oy+720*S.s,S.w,144*S.s);
 for(let i=0;i<8;i++){
   const x=S.ox+(200+i*160)*S.s;
   X.beginPath();X.moveTo(x,S.oy+720*S.s);X.lineTo(S.ox+768*S.s,S.oy+864*S.s);
   X.strokeStyle="rgba(255,180,60,.07)";X.lineWidth=2*S.s;X.stroke();
 }

 // letreiro
 marqueeTitle();

 // laterais
 glowText("GRANDES",410,98,20,"#ffe4a0");
 glowText("PRÊMIOS",410,122,20,"#ffe4a0");
 glowText("GRANDES",410,146,20,"#ffe4a0");
 glowText("EMOÇÕES",410,170,20,"#ffe4a0");
 glowText("SUA",1125,98,20,"#ffe4a0");
 glowText("SORTE",1125,122,20,"#ffe4a0");
 glowText("PODE",1125,146,20,"#ffe4a0");
 glowText("BRILHAR",1125,170,20,"#ffe4a0");
 glowText("AGORA",1125,194,20,"#ffe4a0");

 // subtítulo
 glowText("SOLTE A BOLA E DESCUBRA SEU PRÊMIO",768,132,23,"#ffd979");
}
function curtain(side){
 const left=side<0?0:1536, dir=side<0?1:-1;
 X.save();X.beginPath();
 if(side<0){X.moveTo(S.ox,S.oy);X.lineTo(S.ox+390*S.s,S.oy);X.lineTo(S.ox+300*S.s,S.oy+690*S.s);X.lineTo(S.ox,S.oy+760*S.s)}
 else{X.moveTo(S.ox+1536*S.s,S.oy);X.lineTo(S.ox+1146*S.s,S.oy);X.lineTo(S.ox+1236*S.s,S.oy+690*S.s);X.lineTo(S.ox+1536*S.s,S.oy+760*S.s)}
 X.closePath();
 const g=X.createLinearGradient(S.ox+(side<0?0:1536)*S.s,0,S.ox+(side<0?390:1146)*S.s,0);
 g.addColorStop(0,"#170105");g.addColorStop(.25,"#7e0613");g.addColorStop(.5,"#260208");g.addColorStop(.72,"#a30a19");g.addColorStop(1,"#100104");
 X.fillStyle=g;X.shadowColor="#000";X.shadowBlur=30;X.fill();X.restore();
}
function lightBeam(x1,y1,x2,y2){
 X.save();X.globalAlpha=.09;X.fillStyle="#ffd477";X.beginPath();
 X.moveTo(S.ox+x1*S.s,S.oy+y1*S.s);X.lineTo(S.ox+(x1+70)*S.s,S.oy+y1*S.s);
 X.lineTo(S.ox+(x2+170)*S.s,S.oy+y2*S.s);X.lineTo(S.ox+x2*S.s,S.oy+y2*S.s);X.closePath();X.fill();X.restore();
}
function bulb(x,y){
 const [sx,sy]=sc(x/S.s,y/S.s);
 X.save();X.beginPath();X.arc(sx,sy,5*S.s,0,Math.PI*2);X.fillStyle="#fff4b0";X.shadowColor="#ffad1d";X.shadowBlur=13*S.s;X.fill();X.restore();
}
function marqueeTitle(){
 const text="PLINKO",size=86;
 X.save();X.textAlign="center";X.textBaseline="middle";X.font=`1000 ${size}px Arial`;
 X.fillStyle="#b96b08";X.shadowColor="#ff9800";X.shadowBlur=26;X.fillText(text,S.ox+768*S.s,S.oy+68*S.s);
 X.fillStyle="#ffd35b";X.shadowBlur=9;X.fillText(text,S.ox+768*S.s,S.oy+65*S.s);
 // lâmpadas sobre as letras
 const widths=[57,57,56,62,58,65];
 let xx=768-(widths.reduce((a,b)=>a+b,0)/2);
 for(const w of widths){for(let j=0;j<3;j++){bulb(xx+w*(j+1)/4,42+j*20);};xx+=w}
 X.restore();
}
function board(){
 // corpo triangular
 const pts=[[558,156],[978,156],[1300,740],[236,740]];
 const [a,b,c,d]=pts.map(p=>sc(p[0],p[1]));
 const g=X.createLinearGradient(0,a[1],0,c[1]);g.addColorStop(0,"#11100d");g.addColorStop(.6,"#060605");g.addColorStop(1,"#020202");
 X.beginPath();X.moveTo(...a);X.lineTo(...b);X.lineTo(...c);X.lineTo(...d);X.closePath();X.fillStyle=g;X.fill();
 // moldura dupla dourada
 X.save();X.lineJoin="round";X.lineWidth=17*S.s;X.strokeStyle="#7e4506";X.shadowColor="#ff9f12";X.shadowBlur=22;X.stroke();
 X.lineWidth=6*S.s;X.strokeStyle="#ffd45a";X.shadowBlur=8;X.stroke();X.restore();
 // lâmpadas laterais
 for(let t=.03;t<=.98;t+=.045){
   bulb(558+(236-558)*t,156+(740-156)*t);
   bulb(978+(1300-978)*t,156+(740-156)*t);
 }
 // setas vermelhas
 [676,768,860].forEach(x=>arrow(x,177));
}
function arrow(x,y){
 X.save();X.strokeStyle="#ff2639";X.shadowColor="#ff1730";X.shadowBlur=14*S.s;X.lineWidth=4*S.s;X.lineCap="round";
 for(let j=0;j<2;j++){const yy=y+j*12;X.beginPath();X.moveTo(S.ox+(x-22)*S.s,S.oy+yy*S.s);X.lineTo(S.ox+x*S.s,S.oy+(yy+23)*S.s);X.lineTo(S.ox+(x+22)*S.s,S.oy+yy*S.s);X.stroke()}X.restore();
}
function pegsDraw(){
 for(const p of pegs){
   const [x,y]=sc(p.x,p.y),r=p.r*S.s;
   X.save();X.beginPath();X.arc(x,y,r+4*S.s,0,Math.PI*2);X.fillStyle="rgba(255,175,30,.10)";X.fill();
   const g=X.createRadialGradient(x-r*.45,y-r*.5,1,x,y,r);
   g.addColorStop(0,"#fff1aa");g.addColorStop(.35,"#ffd04d");g.addColorStop(1,"#8c4800");
   X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.fillStyle=g;X.shadowColor="#ffae18";X.shadowBlur=7*S.s;X.fill();X.restore();
 }
}
function prizesDraw(){
 const L=184,R=1350,W=(R-L)/13;
 for(let i=0;i<13;i++){
   const x=L+i*W;
   const hot=(i===win && performance.now()<winTimer);
   const top=706,bottom=850;
   const grad=X.createLinearGradient(0,S.oy+top*S.s,0,S.oy+bottom*S.s);
   if(i<6||i>=10){grad.addColorStop(0,i%2?"#f08b25":"#ef1e34");grad.addColorStop(1,i%2?"#9d4308":"#9e0718")}
   else {grad.addColorStop(0,"#1b1028");grad.addColorStop(1,"#07030b")}
   X.fillStyle=grad;X.fillRect(S.ox+x*S.s,S.oy+top*S.s,W*S.s-2*S.s,(bottom-top)*S.s);
   X.strokeStyle=hot?"#fff2a0":"#17110a";X.lineWidth=hot?4*S.s:2*S.s;X.strokeRect(S.ox+x*S.s,S.oy+top*S.s,W*S.s-2*S.s,(bottom-top)*S.s);
   // ícones simples
   drawPrizeIcon(i,x+W/2,724);
   const lines=wrapPrize(P[i]);
   X.save();X.textAlign="center";X.textBaseline="top";X.font=`900 ${Math.max(12,14*S.s)}px Arial`;X.fillStyle="#fff";X.shadowColor="#000";X.shadowBlur=3;
   lines.forEach((t,j)=>X.fillText(t,S.ox+(x+W/2)*S.s,S.oy+(765+j*17)*S.s));X.restore();
 }
}
function wrapPrize(s){if(s==="iPhone 17 Pro Max")return["iPhone","17 Pro Max"];if(s==="Bicicleta Elétrica")return["Bicicleta","Elétrica"];if(s==="Barra de Ouro")return["Barra","de Ouro"];if(s.includes("CUPONS"))return[s.split(" ").slice(0,2).join(" "), "CUPONS","CARRO"];return s.split(" ").slice(0,2).length?([s.split(" ").slice(0,2).join(" "),s.split(" ").slice(2).join(" ")]):[s]}
function drawPrizeIcon(i,x,y){
 X.save();X.translate(S.ox+x*S.s,S.oy+y*S.s);X.textAlign="center";X.textBaseline="middle";
 X.font=`bold ${28*S.s}px Arial`;X.shadowColor="#fff";X.shadowBlur=10*S.s;
 X.fillStyle=i>=10?"#ffedbf":i===6||i===7||i===8||i===9?"#fff0a0":"#fff0a0";
 const icon=["▤","◉","◉","▤","◉","◉","▯","▯","♢","▱","🚗","🚗","🚗"][i];
 X.fillText(icon,0,0);X.restore();
}
function ballDraw(){
 if(!ball)return;
 const [x,y]=sc(ball.x,ball.y),r=ball.r*S.s;
 const g=X.createRadialGradient(x-r*.42,y-r*.48,1,x,y,r*1.15);
 g.addColorStop(0,"#fff");g.addColorStop(.28,"#fff");g.addColorStop(.62,"#d4d6d8");g.addColorStop(1,"#6c7176");
 X.save();X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.fillStyle=g;X.shadowColor="#fff";X.shadowBlur=14*S.s;X.fill();X.restore();
}
function winFx(){
 FX.clearRect(0,0,S.w,S.h);
 if(win<0||performance.now()>winTimer)return;
 const W=(1350-184)/13,cx=184+(win+.5)*W,[x,y]=sc(cx,760),pulse=.5+.5*Math.sin(performance.now()/100);
 const g=FX.createRadialGradient(x,y,2,x,y,75*S.s);g.addColorStop(0,`rgba(255,220,80,${.45+.25*pulse})`);g.addColorStop(1,"rgba(255,100,0,0)");
 FX.fillStyle=g;FX.fillRect(x-90*S.s,y-80*S.s,180*S.s,160*S.s);
}
function draw(){drawStage();board();pegsDraw();prizesDraw();ballDraw();winFx()}

function spawn(x=768){ball={x:clamp(x,570,966),y:224,vx:0,vy:0,r:10,age:0};state="dragging";draw()}
function finish(){
 if(state!=="falling"||!ball)return;
 state="result";
 win=clamp(Math.floor((ball.x-184)/((1350-184)/13)),0,12);
 resultText.textContent=P[win];winTimer=performance.now()+2600;
 result.classList.add("show");status.textContent="PRÊMIO SORTEADO";draw();
 setTimeout(()=>{result.classList.remove("show");ball=null;state="ready";win=-1;status.textContent="TOQUE • ARRASTE • SOLTE";draw()},2600);
}
function physics(dt){
 if(!ball)return;
 ball.age+=dt;ball.vy+=1040*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
 // paredes do triângulo
 const t=clamp((ball.y-224)/(700-224),0,1);
 const left=558+(236-558)*t, right=978+(1300-978)*t, pad=ball.r+2;
 if(ball.x<left+pad){ball.x=left+pad;ball.vx=Math.abs(ball.vx)*.76}
 if(ball.x>right-pad){ball.x=right-pad;ball.vx=-Math.abs(ball.vx)*.76}
 // colisões iteradas
 for(let k=0;k<2;k++)for(const p of pegs){
   const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy),min=ball.r+p.r;
   if(d<min){
     const nx=dx/(d||1),ny=dy/(d||1),over=min-d;
     ball.x+=nx*(over+.2);ball.y+=ny*(over+.2);
     const vn=ball.vx*nx+ball.vy*ny;
     if(vn<0){
       ball.vx-=1.55*vn*nx;ball.vy-=1.55*vn*ny;
       const tx=-ny,ty=nx,vt=ball.vx*tx+ball.vy*ty;
       ball.vx-=vt*tx*.035;ball.vy-=vt*ty*.035;
     }
   }
 }
 ball.vx*=.998;
 // compartimentos: guias verticais permitem a bola cair naturalmente.
 if(ball.y>700){
   const W=(1350-184)/13,idx=clamp(Math.floor((ball.x-184)/W),0,12);
   const l=184+idx*W,r=l+W;
   if(ball.x<l+ball.r){ball.x=l+ball.r;ball.vx=Math.abs(ball.vx)*.25}
   if(ball.x>r-ball.r){ball.x=r-ball.r;ball.vx=-Math.abs(ball.vx)*.25}
 }
 if(ball.y>790){ball.y=790;ball.vy=0;ball.vx*=.5;if(Math.abs(ball.vx)<5)finish()}
 if(ball.age>7)finish();
}
function loop(now){
 const e=Math.min(.05,(now-last)/1000);last=now;acc+=e;const dt=1/180;
 let n=0;while(acc>=dt&&n++<10){physics(dt);acc-=dt}
 draw();if(state==="falling")raf=requestAnimationFrame(loop);
}

function down(e){
 e.preventDefault();if(state==="falling")return;
 const [x,y]=bs(e.clientX,e.clientY);
 if(y>190&&y<290){pointer=true;spawn(x)}
}
function move(e){
 if(!pointer||state!=="dragging")return;e.preventDefault();
 const [x]=bs(e.clientX,e.clientY);ball.x=clamp(x,570,966);draw()
}
function up(e){if(!pointer)return;e.preventDefault();pointer=false;
 if(state==="dragging"){state="falling";ball.vx=(Math.random()-.5)*20;ball.vy=15;status.textContent="A BOLA ESTÁ DESCENDO...";last=performance.now();acc=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
}
C.addEventListener("pointerdown",down,{passive:false});
C.addEventListener("pointermove",move,{passive:false});
C.addEventListener("pointerup",up,{passive:false});
C.addEventListener("pointercancel",up,{passive:false});
addEventListener("resize",resize);addEventListener("orientationchange",()=>setTimeout(resize,100));
resize();spawn(768);
})();
</script>
</body>
</html>
