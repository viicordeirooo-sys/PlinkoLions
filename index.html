    view = {x:(W-BASE_W*s)/2, y:(H-BASE_H*s)/2, w:BASE_W*s, h:BASE_H*s, s};
    for(const c of [play,fx]){
      c.width = Math.round(W*dpr);
      c.height = Math.round(H*dpr);
      c.style.width = W+"px";
      c.style.height = H+"px";
    }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    fctx.setTransform(dpr,0,0,dpr,0,0);
    pegs = [];
    for(const [y,xs] of pegRows){
      for(const x of xs) pegs.push({x,y,r:7});
    }
    if(ball) {
      ball.r = 10;
      ball.x = Math.max(350,Math.min(1185,ball.x));
    }
    draw();
  }

  // Converte coordenadas do jogo 1536x864 para a tela.
  function toScreen(x,y){ return {x:view.x+x*view.s,y:view.y+y*view.s}; }
  function toBase(clientX,clientY){
    return {x:(clientX-view.x)/view.s,y:(clientY-view.y)/view.s};
  }
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

  function drawBall(){
    if(!ball) return;
    const p=toScreen(ball.x,ball.y), r=ball.r*view.s;
    const g=ctx.createRadialGradient(p.x-r*.38,p.y-r*.42,r*.05,p.x,p.y,r);
    g.addColorStop(0,"#ffffff");
    g.addColorStop(.25,"#ffffff");
    g.addColorStop(.58,"#e0e2e4");
    g.addColorStop(.84,"#92979c");
    g.addColorStop(1,"#53575b");
    ctx.save();
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fillStyle=g;ctx.shadowColor="rgba(255,255,255,.85)";ctx.shadowBlur=12*view.s;
    ctx.fill();ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    drawBall();
    if(state==="dragging" && ball){
      const p=toScreen(ball.x,245);
      ctx.save();
      ctx.strokeStyle="rgba(255,210,91,.65)";
      ctx.lineWidth=2*view.s;
      ctx.setLineDash([5*view.s,7*view.s]);
      ctx.beginPath();ctx.moveTo(p.x,245*view.s+view.y);ctx.lineTo(p.x,274*view.s+view.y);ctx.stroke();
      ctx.restore();
    }
    drawWinFx();
  }

  function drawWinFx(){
    fctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    if(winIndex<0 || performance.now()>winUntil) return;
    const left=185 + winIndex*(1165/13);
    const right=185 + (winIndex+1)*(1165/13);
    const cx=(left+right)/2;
    const p=toScreen(cx,748);
    const pulse=.5+.5*Math.sin(performance.now()/90);
    const grad=fctx.createRadialGradient(p.x,p.y,4,p.x,p.y,65*view.s);
    grad.addColorStop(0,`rgba(255,218,75,${.35+.25*pulse})`);
    grad.addColorStop(1,"rgba(255,150,0,0)");
    fctx.fillStyle=grad;
    fctx.fillRect(p.x-90*view.s,p.y-80*view.s,180*view.s,160*view.s);
  }

  function newBall(x=768){
    ball={
      x:clamp(x,330,1205), y:224,
      vx:0, vy:0, r:10,
      age:0, collisions:0
    };
    state="dragging";
    winIndex=-1;
    draw();
  }

  function startDrag(x){
    if(state==="falling") return;
    if(state==="result") { state="ready"; winIndex=-1; ball=null; }
    newBall(x);
  }

  function moveDrag(x){
    if(state!=="dragging" || !ball) return;
    ball.x=clamp(x,335,1201);
    ball.y=224;
    draw();
  }

  function release(){
    if(state!=="dragging" || !ball) return;
    state="falling";
    // Uma pequena velocidade lateral natural. O jogador escolhe x; não escolhemos o prêmio.
    ball.vx=(Math.random()-.5)*18;
    ball.vy=18;
    last=performance.now();
    accumulator=0;
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(loop);
  }

  // Física fixa em 120 Hz para evitar atravessar pinos em telas diferentes.
  function physicsStep(dt){
    if(!ball) return;

    const gravity=980;
    ball.vy += gravity*dt;
    ball.x += ball.vx*dt;
    ball.y += ball.vy*dt;
    ball.age += dt;

    // Paredes inclinadas do tabuleiro, seguindo a referência.
    const topY=246, bottomY=649, t=clamp((ball.y-topY)/(bottomY-topY),0,1);
    const left=558+(245-558)*t;
    const right=978+(1291-978)*t;
    const pad=ball.r+2;

    if(ball.x<left+pad){
      ball.x=left+pad;
      ball.vx=Math.abs(ball.vx)*.72;
    }
    if(ball.x>right-pad){
      ball.x=right-pad;
      ball.vx=-Math.abs(ball.vx)*.72;
    }

    // Colisões círculo-círculo com os pinos.
    for(const p of pegs){
      const dx=ball.x-p.x, dy=ball.y-p.y;
      const dist2=dx*dx+dy*dy;
      const min=ball.r+p.r;
      if(dist2 < min*min){
        let dist=Math.sqrt(dist2);
        if(dist<.001) dist=.001;
        const nx=dx/dist, ny=dy/dist;
        const overlap=min-dist;
        ball.x += nx*(overlap+.35);
        ball.y += ny*(overlap+.35);

        const vn=ball.vx*nx+ball.vy*ny;
        if(vn<0){
          // Restituição + atrito tangencial.
          ball.vx -= (1.0+0.62)*vn*nx;
          ball.vy -= (1.0+0.62)*vn*ny;
          const tx=-ny, ty=nx;
          const vt=ball.vx*tx+ball.vy*ty;
          ball.vx -= vt*tx*.035;
          ball.vy -= vt*ty*.035;

          // Microvariação só para quebrar trajetórias perfeitamente simétricas.
          ball.vx += (Math.random()-.5)*7;
          ball.collisions++;
        }
      }
    }

    ball.vx*=.9985;

    // Região dos compartimentos. A bola entra fisicamente no vão e para.
    if(ball.y>=646){
      const idx=clamp(Math.floor((ball.x-184)/(1165/13)),0,12);
      const binL=184+idx*(1165/13), binR=184+(idx+1)*(1165/13);
      if(ball.x<binL+ball.r){ball.x=binL+ball.r;ball.vx=Math.abs(ball.vx)*.25}
      if(ball.x>binR-ball.r){ball.x=binR-ball.r;ball.vx=-Math.abs(ball.vx)*.25}
      ball.vy += 300*dt;
    }

    if(ball.y>=765){
      ball.y=765;
      ball.vy=0;
      ball.vx*=.55;
      if(Math.abs(ball.vx)<5 || ball.age>5.8){
        finish();
      }
    }

    // Segurança: nunca deixa a partida travar.
    if(ball.age>7.0) finish();
  }

  function loop(now){
    const elapsed=Math.min((now-last)/1000,.05);
    last=now;
    accumulator+=elapsed;
    const fixed=1/120;
    let n=0;
    while(accumulator>=fixed && n<8){
      physicsStep(fixed);
      accumulator-=fixed;n++;
    }
    draw();
    if(state==="falling") raf=requestAnimationFrame(loop);
  }

  function finish(){
    if(state!=="falling" || !ball) return;
    state="result";
    winIndex=clamp(Math.floor((ball.x-184)/(1165/13)),0,12);
    winUntil=performance.now()+2300;
    draw();
    // Mantém a bola no compartimento por 2,3 s e prepara a próxima rodada.
    setTimeout(()=>{
      if(state==="result"){
        ball=null;state="ready";winIndex=-1;draw();
      }
    },2300);
  }

  // Touch/mouse: o ponto de soltura é escolhido pelo jogador.
  let pointerActive=false;
  function down(e){
    e.preventDefault();
    if(state==="falling") return;
    const p=toBase(e.clientX,e.clientY);
    // A área de escolha é a entrada superior do tabuleiro.
    if(p.y>=190 && p.y<=285){
      pointerActive=true;
      startDrag(p.x);
    }
  }
  function move(e){
    if(!pointerActive) return;
    e.preventDefault();
    const p=toBase(e.clientX,e.clientY);
    moveDrag(p.x);
  }
  function up(e){
    if(!pointerActive)return;
    e.preventDefault();
    pointerActive=false;
    release();
  }

  play.addEventListener("pointerdown",down,{passive:false});
  play.addEventListener("pointermove",move,{passive:false});
  play.addEventListener("pointerup",up,{passive:false});
  play.addEventListener("pointercancel",up,{passive:false});
  window.addEventListener("resize",resize);
  window.addEventListener("orientationchange",()=>setTimeout(resize,100));

  resize();
  // Bolinha inicial na mesma posição da referência, pronta para ser arrastada.
  newBall(768);
})();
</script>
</body>
</html>
