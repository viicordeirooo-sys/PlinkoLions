<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PLINKO — Jogo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030405;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#stage{
  position:relative;width:100vw;height:100vh;max-width:1920px;max-height:1080px;
  overflow:hidden;background:
    radial-gradient(ellipse at 50% 18%,rgba(255,176,48,.15),transparent 28%),
    radial-gradient(ellipse at 50% 82%,rgba(160,0,0,.16),transparent 38%),
    linear-gradient(90deg,#090909 0,#160506 9%,#050505 20%,#050505 80%,#160506 91%,#090909 100%);
}
#stage:before,#stage:after{content:"";position:absolute;top:0;bottom:0;width:18%;z-index:0;
  background:linear-gradient(90deg,#020202 0,#35050b 42%,#130204 78%,#020202 100%);
  box-shadow:inset -30px 0 45px #000;transform:skewX(-5deg);opacity:.96}
#stage:before{left:-4%}#stage:after{right:-4%;transform:scaleX(-1) skewX(-5deg)}
.curtain{position:absolute;top:-5%;bottom:-5%;width:11%;z-index:1;opacity:.9;
 background:repeating-linear-gradient(90deg,#220207 0 9px,#8c0715 13px,#34020a 23px,#a30b1a 30px);
 filter:drop-shadow(0 0 18px #000)}
.curtain.l{left:5%;transform:skewX(-9deg)}.curtain.r{right:5%;transform:scaleX(-1) skewX(-9deg)}
.header{position:absolute;top:1.4%;left:50%;transform:translateX(-50%);z-index:8;text-align:center;width:60%}
.title{font-weight:1000;font-size:clamp(42px,5.3vw,94px);line-height:.9;letter-spacing:.08em;
 color:#ffd45a;text-shadow:0 0 4px #fff,0 0 11px #ff9d00,0 0 28px #ff5a00,4px 5px 0 #7d3a00;
 white-space:nowrap}
.title span{display:inline-block;position:relative;padding:0 .045em}
.title span:after{content:"";position:absolute;width:.12em;height:.12em;border-radius:50%;background:#fff7b2;
 box-shadow:0 0 5px #fff,0 0 12px #ffb000;left:45%;top:6%}
.subtitle{margin-top:8px;font-size:clamp(13px,1.35vw,25px);font-weight:800;letter-spacing:.09em;color:#ffd76b;
 text-shadow:0 0 8px #ff8a00}
.side{position:absolute;top:9%;z-index:5;width:12%;font-weight:900;text-align:center;line-height:1.28;
 font-size:clamp(12px,1.25vw,23px);letter-spacing:.03em;color:#ffe09a;text-shadow:0 0 9px #ff8400}
.side.left{left:8%}.side.right{right:8%}
.marquee{position:absolute;top:5%;left:3%;right:3%;height:10%;z-index:3;pointer-events:none}
.marquee:before,.marquee:after{content:"";position:absolute;top:0;width:7px;height:100%;
 background:linear-gradient(#fff,#ffb31c,#fff,#ffb31c);box-shadow:0 0 12px #ff9b00}
.marquee:before{left:0}.marquee:after{right:0}
.boardWrap{position:absolute;left:50%;top:16%;transform:translateX(-50%);width:min(66vw,1180px);height:72%;z-index:6}
.boardGlow{position:absolute;inset:0;border-radius:16% 16% 4% 4%;filter:blur(18px);
 background:radial-gradient(ellipse at 50% 50%,rgba(255,177,22,.17),transparent 66%);pointer-events:none}
#game{position:absolute;inset:0;width:100%;height:100%}
#ui{position:absolute;inset:0;z-index:9;pointer-events:none}
#hint{position:absolute;top:13.2%;left:50%;transform:translateX(-50%);font-size:clamp(12px,1.1vw,21px);
 font-weight:900;letter-spacing:.12em;color:#fff1b0;text-shadow:0 0 10px #ff9500;opacity:.95;transition:.3s}
#result{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.8);opacity:0;
 padding:20px 34px;border:2px solid #ffc53d;border-radius:16px;background:rgba(5,3,2,.94);
 box-shadow:0 0 30px #ff8d00, inset 0 0 25px rgba(255,177,0,.18);text-align:center;transition:.35s;min-width:280px}
#result.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#result .small{font-size:13px;letter-spacing:.18em;color:#ffd46a;font-weight:800}
#result .big{font-size:clamp(25px,3vw,48px);font-weight:1000;margin-top:8px;color:#fff}
#touchZone{position:absolute;left:50%;top:17%;transform:translateX(-50%);width:62%;height:13%;z-index:12}
#ballCursor{position:absolute;z-index:13;width:28px;height:28px;border-radius:50%;display:none;
 background:radial-gradient(circle at 32% 28%,#fff,#f7f7f7 25%,#aeb5bd 67%,#626870);
 box-shadow:0 0 0 2px rgba(255,255,255,.45),0 0 18px rgba(255,255,255,.5);pointer-events:none}
.prizes{position:absolute;left:50%;bottom:2.2%;transform:translateX(-50%);width:min(66vw,1180px);
 height:9%;display:grid;grid-template-columns:repeat(13,1fr);z-index:10;gap:2px}
.prize{position:relative;display:flex;align-items:flex-end;justify-content:center;padding:0 2px 9px;
 border-radius:7px 7px 2px 2px;border:1px solid #090909;overflow:hidden;
 background:linear-gradient(180deg,#ed1e32 0,#d10d20 100%);box-shadow:0 0 12px rgba(255,30,40,.3),inset 0 0 10px rgba(255,255,255,.08)}
.prize:nth-child(even){background:linear-gradient(180deg,#f39a2e,#d86d12)}
.prize:nth-child(7),.prize:nth-child(8),.prize:nth-child(9),.prize:nth-child(10){background:linear-gradient(180deg,#f39b28,#c9680c)}
.prize b{font-size:clamp(8px,.72vw,14px);line-height:1.05;text-align:center;color:#fff;text-shadow:0 1px 2px #000;word-break:break-word}
.floor{position:absolute;bottom:0;left:0;right:0;height:2.2%;z-index:4;background:linear-gradient(#160c08,#020202);
 box-shadow:0 -5px 25px rgba(255,125,0,.14)}
@media(max-width:800px){
 .header{top:2%;width:70%}.title{font-size:10vw}.subtitle{font-size:2.5vw}
 .side{display:none}.boardWrap{top:18%;width:88vw;height:70%}.prizes{width:88vw;height:10%;bottom:1.5%}
 #touchZone{top:19%;width:82%;height:12%}
}
</style>
</head>
<body>
<div id="stage">
 <div class="curtain l"></div><div class="curtain r"></div>
 <div class="marquee"></div>
 <div class="header"><div class="title" id="title"></div><div class="subtitle">SOLTE A BOLA E DESCUBRA SEU PRÊMIO</div></div>
 <div class="side left">GRANDES<br>PRÊMIOS<br>GRANDES<br>EMOÇÕES</div>
 <div class="side right">SUA<br>SORTE<br>PODE<br>BRILHAR<br>AGORA</div>
 <div id="hint">TOQUE • ARRASTE • SOLTE</div>
 <div class="boardWrap"><div class="boardGlow"></div><canvas id="game"></canvas></div>
 <div id="touchZone"></div><div id="ballCursor"></div>
 <div id="result"><div class="small">SEU PRÊMIO</div><div class="big" id="resultText"></div></div>
 <div class="prizes" id="prizes"></div>
 <div class="floor"></div>
</div>
<script>
const title="PLINKO", titleEl=document.getElementById("title");
[...title].forEach(c=>{let s=document.createElement("span");s.textContent=c;titleEl.appendChild(s)});
const prizeNames=[
"R$ 100 FICHAS","R$ 200 FICHAS","R$ 500 FICHAS","R$ 1.000 FICHAS","R$ 2.000 FICHAS","R$ 5.000 FICHAS",
"iPad","iPhone 17 Pro Max","Bicicleta Elétrica","Barra de Ouro","10 CUPONS CARRO","15 CUPONS CARRO","20 CUPONS CARRO"
];
const prizes=document.getElementById("prizes");
prizeNames.forEach((p,i)=>{const d=document.createElement("div");d.className="prize";d.innerHTML="<b>"+p+"</b>";prizes.appendChild(d)});

const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),wrap=document.querySelector(".boardWrap");
let W,H,dpr,pegs=[],ball=null,running=false,drag=false,last=0,raf=0,selectedX=null;
const rows=13, cols=14;
function resize(){
 dpr=Math.min(devicePixelRatio||1,2); W=wrap.clientWidth; H=wrap.clientHeight;
 canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);
 buildPegs(); draw();
}
function buildPegs(){
 pegs=[]; 
 const top=H*.105, bottom=H*.73;
 const dy=(bottom-top)/(rows-1);
 const center=W*.5;
 const dx=Math.min(W/(cols+3),W*.055);
 for(let r=0;r<rows;r++){
   const n= r%2===0 ? cols : cols-1;
   const rowWidth=(n-1)*dx;
   const x0=center-rowWidth/2;
   for(let c=0;c<n;c++) pegs.push({x:x0+c*dx,y:top+r*dy,r:Math.max(3.8,dx*.105)});
 }
}
function drawBoard(){
 ctx.clearRect(0,0,W,H);
 // triangular dark board
 const topX=W*.29, botX=W*.03, rightBot=W*.97, rightTop=W*.71, topY=H*.055, botY=H*.83;
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#15120d");g.addColorStop(.55,"#080807");g.addColorStop(1,"#030303");
 ctx.beginPath();ctx.moveTo(topX,topY);ctx.lineTo(rightTop,topY);ctx.lineTo(rightBot,botY);ctx.lineTo(botX,botY);ctx.closePath();ctx.fillStyle=g;ctx.fill();
 // gold frame
 ctx.save();ctx.lineWidth=Math.max(8,W*.008);ctx.strokeStyle="#9a5b0a";ctx.shadowColor="#ffae22";ctx.shadowBlur=18;ctx.stroke();
 ctx.lineWidth=Math.max(3,W*.003);ctx.strokeStyle="#ffd35a";ctx.shadowBlur=7;ctx.stroke();ctx.restore();
 // marquee bulbs on frame
 for(let t=.04;t<.97;t+=.055){
   const y=topY+(botY-topY)*t;
   const xl=topX+(botX-topX)*t, xr=rightTop+(rightBot-rightTop)*t;
   bulb(xl,y);bulb(xr,y);
 }
 for(let x=topX+.04*(rightTop-topX);x<rightTop;x+=W*.055)bulb(x,topY);
}
function bulb(x,y){
 ctx.beginPath();ctx.arc(x,y,Math.max(2.5,W*.0022),0,Math.PI*2);ctx.fillStyle="#fff3b0";ctx.shadowColor="#ffad18";ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;
}
function drawPegs(){
 pegs.forEach(p=>{
   ctx.beginPath();ctx.arc(p.x,p.y,p.r+4,0,Math.PI*2);ctx.fillStyle="rgba(255,164,24,.08)";ctx.fill();
   ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
   const g=ctx.createRadialGradient(p.x-p.r*.35,p.y-p.r*.4,1,p.x,p.y,p.r);
   g.addColorStop(0,"#fff4bd");g.addColorStop(.32,"#ffd24f");g.addColorStop(1,"#9a5200");
   ctx.fillStyle=g;ctx.shadowColor="#ffb41e";ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
 });
}
function drawBall(){
 if(!ball)return;
 const r=ball.r;
 const g=ctx.createRadialGradient(ball.x-r*.35,ball.y-r*.4,1,ball.x,ball.y,r*1.2);
 g.addColorStop(0,"#fff");g.addColorStop(.25,"#f6f6f6");g.addColorStop(.65,"#aeb5bc");g.addColorStop(1,"#5c6269");
 ctx.beginPath();ctx.arc(ball.x,ball.y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.shadowColor="#fff";ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
}
function draw(){drawBoard();drawPegs();drawBall()}
function pointFromEvent(e){
 const rect=canvas.getBoundingClientRect(), t=e.touches?e.touches[0]:e;
 return {x:t.clientX-rect.left,y:t.clientY-rect.top};
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function startBall(x){
 ball={x:clamp(x,W*.27,W*.73),y:H*.075,r:Math.max(6,Math.min(10,W*.012)),vx:0,vy:0,alive:true};
 selectedX=ball.x; drag=true; document.getElementById("ballCursor").style.display="block"; updateCursor();
}
function updateCursor(){
 if(!ball)return;const z=document.getElementById("ballCursor");z.style.left=(wrap.offsetLeft+ball.x-14)+"px";z.style.top=(wrap.offsetTop+ball.y-14)+"px";
}
function release(){
 if(!ball||!drag)return;drag=false;document.getElementById("ballCursor").style.display="none";
 ball.vy=40;ball.vx=(Math.random()-.5)*15;running=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
 document.getElementById("hint").textContent="A BOLA ESTÁ DESCENDO...";
}
function loop(t){
 const dt=Math.min((t-last)/1000,.022);last=t;
 step(dt);draw();
 if(running)raf=requestAnimationFrame(loop);else finish();
}
function step(dt){
 if(!ball)return;
 ball.vy += 620*dt; ball.x += ball.vx*dt; ball.y += ball.vy*dt;
 // keep ball inside the triangular chamber
 const topY=H*.055, botY=H*.83, u=(ball.y-topY)/(botY-topY);
 const left=W*.29+(W*.03-W*.29)*u, right=W*.71+(W*.97-W*.71)*u;
 const pad=ball.r+3;
 if(ball.x<left+pad){ball.x=left+pad;ball.vx=Math.abs(ball.vx)*.72}
 if(ball.x>right-pad){ball.x=right-pad;ball.vx=-Math.abs(ball.vx)*.72}
 // peg collisions
 for(const p of pegs){
   let dx=ball.x-p.x,dy=ball.y-p.y,dist=Math.hypot(dx,dy),min=ball.r+p.r;
   if(dist<min && dist>0){
     const nx=dx/dist,ny=dy/dist;
     ball.x=p.x+nx*(min+.25);ball.y=p.y+ny*(min+.25);
     const vn=ball.vx*nx+ball.vy*ny;
     if(vn<0){
       ball.vx-=1.72*vn*nx;ball.vy-=1.72*vn*ny;
       ball.vx*=.985;ball.vy*=.985;
       // small natural lateral randomness, not target-directed
       ball.vx += (Math.random()-.5)*18;
     }
   }
 }
 // tiny air drag
 ball.vx*=Math.pow(.996,dt*60);
 // bottom
 if(ball.y>H*.845){
   ball.y=H*.845;
   ball.vy=0;ball.vx*=.7;
   // let it settle in the actual x position
   if(Math.abs(ball.vx)<8){running=false}
 }
}
function finish(){
 if(!ball)return;
 const idx=clamp(Math.floor((ball.x/(W))*13),0,12);
 document.getElementById("resultText").textContent=prizeNames[idx];
 document.getElementById("result").classList.add("show");
 document.getElementById("hint").textContent="TOQUE NA BOLA PARA JOGAR NOVAMENTE";
 setTimeout(()=>{document.getElementById("result").classList.remove("show");ball=null;draw();},2600);
}
function pointerDown(e){
 e.preventDefault();
 if(running)return;
 const p=pointFromEvent(e);
 // start anywhere in the upper entry zone, then choose horizontal release
 if(p.y< H*.25){startBall(p.x)}
}
function pointerMove(e){
 if(!drag||!ball)return;e.preventDefault();const p=pointFromEvent(e);
 ball.x=clamp(p.x,W*.27,W*.73);ball.y=H*.075;ball.vx=0;ball.vy=0;selectedX=ball.x;updateCursor();draw();
}
function pointerUp(e){if(drag){e.preventDefault();release()}}
canvas.addEventListener("touchstart",pointerDown,{passive:false});
canvas.addEventListener("touchmove",pointerMove,{passive:false});
canvas.addEventListener("touchend",pointerUp,{passive:false});
canvas.addEventListener("mousedown",pointerDown);window.addEventListener("mousemove",pointerMove);window.addEventListener("mouseup",pointerUp);
window.addEventListener("resize",resize);
resize();
</script>
</body>
</html>
