<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>PLINKO</title>
<style>
:root{--gold:#f4bf43;--gold2:#ffd86b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
#app{position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;background:
 radial-gradient(ellipse at 4% 30%,rgba(190,119,18,.28),transparent 15%),
 radial-gradient(ellipse at 96% 30%,rgba(190,119,18,.28),transparent 15%),
 radial-gradient(ellipse at 50% 43%,rgba(91,49,8,.16),transparent 42%),
 linear-gradient(#030303,#080604 60%,#020202)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:7}
.top{position:absolute;z-index:5;top:2.3%;left:50%;transform:translateX(-50%);width:100%;text-align:center;pointer-events:none}
.title{display:inline-block;padding:0 14px 4px;border:2px solid rgba(244,191,67,.65);border-radius:10px;background:linear-gradient(#3a2509,#120c03);font-family:Georgia,serif;font-weight:900;font-size:clamp(39px,6vw,88px);line-height:.82;letter-spacing:1px;color:#ffd35e;text-shadow:0 0 6px #ffae1c,0 2px 0 #7b4000,0 0 20px rgba(255,174,31,.55);box-shadow:0 0 18px rgba(255,174,31,.18),inset 0 0 12px rgba(255,206,96,.12)}
.sub{margin-top:8px;font-size:clamp(12px,1.55vw,24px);font-weight:900;letter-spacing:.45px;color:#ffe6aa;text-shadow:0 0 9px rgba(255,171,32,.7)}
.lights{position:absolute;z-index:4;top:5.5%;display:flex;gap:5px;pointer-events:none}
.lights.l{left:4%}.lights.r{right:4%}
.lights i{width:13px;height:13px;border-radius:50%;background:#ffd66a;box-shadow:0 0 8px #ffb52a,0 0 18px rgba(255,178,38,.7)}
.prizes{position:absolute;z-index:6;left:0;right:0;bottom:0;height:22.5%;display:grid;grid-template-columns:repeat(13,1fr);background:#050403}
.prize{position:relative;min-width:0;border-top:1px solid rgba(255,202,80,.75);border-right:1px solid rgba(255,202,80,.38);background:linear-gradient(180deg,var(--c1),rgba(0,0,0,.92) 72%);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7%}
.prize:first-child{border-left:1px solid rgba(255,202,80,.55)}
.prize .icon{height:43%;width:76%;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 8px var(--c2));font-size:clamp(22px,4vw,54px);color:var(--c2);font-weight:900}
.prize .label{font-size:clamp(8px,.95vw,15px);line-height:1.45;text-align:center;font-weight:900;color:#fff;white-space:normal;text-shadow:0 1px 3px #000}
.chips{letter-spacing:-5px;font-size:clamp(20px,3.2vw,44px)!important}
.phone{font-size:clamp(25px,3.5vw,48px)!important}.bike{font-size:clamp(23px,3vw,45px)!important}.gold{font-size:clamp(18px,2.7vw,40px)!important}.car{font-size:clamp(23px,3vw,44px)!important}
@media(max-width:600px){
 .top{top:1.2%}.title{font-size:40px;padding:0 10px 4px}.sub{font-size:10px;margin-top:5px}
 .lights{top:5.8%;gap:3px}.lights i{width:10px;height:10px}
 .prizes{height:22.5%}.prize{padding-top:5%}.prize .icon{height:42%}.prize .label{font-size:8px;line-height:1.65}
}
</style>
</head>
<body>
<div id="app">
<div class="top"><div class="title">PLINKO</div><div class="sub">SOLTE A BOLA E DESCUBRA SEU PRÊMIO</div></div>
<div class="lights l"></div><div class="lights r"></div>
<canvas id="game"></canvas>
<div class="prizes" id="prizes"></div>
</div>
<div id="standby" style="position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.82);text-align:center">
  <button id="playBtn" style="border:2px solid #f4bf43;border-radius:14px;background:linear-gradient(#3a2509,#120c03);color:#ffd86b;font:900 28px Georgia,serif;padding:16px 42px;box-shadow:0 0 25px rgba(255,185,45,.45);text-shadow:0 0 8px #ffae1c;cursor:pointer">JOGAR</button>
</div>
<div id="result" style="position:absolute;z-index:10;left:50%;top:58%;transform:translate(-50%,-50%);display:none;pointer-events:none;text-align:center;padding:14px 20px;border:2px solid #f4bf43;border-radius:12px;background:rgba(10,7,2,.94);box-shadow:0 0 25px rgba(255,185,45,.45);color:#fff;font-family:Arial,sans-serif;font-weight:900"><div style="font-size:12px;color:#ffd86b;letter-spacing:1px">PRÊMIO</div><div id="resultText" style="font-size:22px;margin-top:4px"></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const prizeData=[
 ['R$ 100','FICHAS','chips','#4b0909','#ff4038','🔴'],
 ['R$ 200','FICHAS','chips','#5a3c08','#ffd04c','🟡'],
 ['R$ 500','FICHAS','chips','#5c5305','#fff05a','🟡'],
 ['R$ 1.000','FICHAS','chips','#063b22','#40ef91','🟢'],
 ['R$ 2.000','FICHAS','chips','#05364a','#3ed8ff','🔵'],
 ['R$ 5.000','FICHAS','chips','#06264d','#45aaff','🔵'],
 ['iPad','','phone','#25054a','#b84cff','▯'],
 ['iPhone 17','Pro Max','phone','#4a0b48','#ff55dc','▯'],
 ['Bicicleta','Elétrica','bike','#4a3b05','#ffd95a','♢'],
 ['Barra de','Ouro','gold','#4a3b05','#ffd95a','▰'],
 ['10','CUPONS CARRO','car','#4b0808','#ff3b35','▰'],
 ['15','CUPONS CARRO','car','#4b0808','#ff3b35','▰'],
 ['20','CUPONS CARRO','car','#4b0808','#ff3b35','▰']
];
for(const side of [document.querySelector('.lights.l'),document.querySelector('.lights.r')]) for(let i=0;i<5;i++){const s=document.createElement('i');side.appendChild(s)}
const prizeBox=document.getElementById('prizes');
prizeData.forEach((p,i)=>{const d=document.createElement('div');d.className='prize';d.style.setProperty('--c1',p[3]);d.style.setProperty('--c2',p[4]);d.innerHTML=`<div class="icon ${p[2]}">${p[5]}</div><div class="label">${p[0]}<br>${p[1]}</div>`;prizeBox.appendChild(d)});

let dpr=1,W=0,H=0,pegs=[],ball=null,dragging=false,running=false,targetBin=0,last=0,standby=true;
let cfg={weights:[12,10,7,5,4,3,2,1.5,1.2,.8,3,2,1],active:Array(13).fill(true),stock:Array(13).fill(999)};
try{const s=JSON.parse(localStorage.getItem('plinko_cfg'));if(s)cfg={...cfg,...s}}catch(e){}

function resize(){
 dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);
 build();
 if(!running&&!dragging) resetBall();
}
function resetBall(){ball={x:W/2,y:H*.205,vx:0,vy:0,r:Math.max(10,Math.min(15,W*.018))}}
function build(){
 pegs=[];
 const top=H*.245, bottom=H*.748, rows=12;
 const left=W*.065,right=W*.935;
 for(let r=0;r<rows;r++){
   const n=2+r;
   const y=top+(bottom-top)*r/(rows-1);
   const half=(left+(right-left)*r/(rows-1)/2); // half-width at row
   const cx=W/2;
   const rowHalf=(W*.055)+(W*.375)*r/(rows-1);
   for(let i=0;i<n;i++){
     const x=cx-rowHalf+(2*rowHalf)*i/(n-1);
     pegs.push({x,y,r:Math.max(5.5,Math.min(8,W*.010))});
   }
 }
}
function goldPeg(p){
 const g=ctx.createRadialGradient(p.x-p.r*.35,p.y-p.r*.45,1,p.x,p.y,p.r*1.5);
 g.addColorStop(0,'#fff1a6');g.addColorStop(.28,'#ffd35c');g.addColorStop(.7,'#b56b08');g.addColorStop(1,'#4a2600');
 ctx.beginPath();ctx.arc(p.x,p.y,p.r*1.35,0,Math.PI*2);ctx.fillStyle='rgba(255,183,43,.08)';ctx.fill();
 ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=g;ctx.shadowColor='#ffb72e';ctx.shadowBlur=7;ctx.fill();ctx.shadowBlur=0;
}
function draw(){
 ctx.clearRect(0,0,W,H);
 for(const p of pegs)goldPeg(p);
 if(ball){
  const g=ctx.createRadialGradient(ball.x-ball.r*.35,ball.y-ball.r*.45,1,ball.x,ball.y,ball.r*1.4);
  g.addColorStop(0,'#fff');g.addColorStop(.3,'#eee');g.addColorStop(.72,'#aaa');g.addColorStop(1,'#555');
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle=g;ctx.shadowColor='#fff';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
 }
 requestAnimationFrame(draw);
}
function pickTarget(){
 let a=prizeData.map((_,i)=>(cfg.active?.[i]!==false && (+cfg.stock?.[i]||999)>0)?Math.max(0,+cfg.weights?.[i]||0):0),sum=a.reduce((x,y)=>x+y,0);
 if(!sum)return 0;let q=Math.random()*sum;for(let i=0;i<a.length;i++){q-=a[i];if(q<=0)return i}return a.length-1;
}
function targetX(i){return W*(i+.5)/13}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function begin(e){
 if(running)return;
 const p=point(e);
 // only the top launch zone can grab the ball
 if(Math.hypot(p.x-ball.x,p.y-ball.y)>Math.max(38,ball.r*4))return;
 dragging=true;canvas.setPointerCapture?.(e.pointerId);e.preventDefault();
}
function move(e){
 if(!dragging)return;const p=point(e);
 ball.x=Math.max(W*.08,Math.min(W*.92,p.x));ball.y=H*.205;e.preventDefault();
}
function release(e){
 if(!dragging)return;dragging=false;
 targetBin=pickTarget();ball.vx=(targetX(targetBin)-ball.x)*.0018;ball.vy=0.9;running=true;document.getElementById('result').style.display='none';e.preventDefault();
}
canvas.addEventListener('pointerdown',begin,{passive:false});
canvas.addEventListener('pointermove',move,{passive:false});
canvas.addEventListener('pointerup',release,{passive:false});
canvas.addEventListener('pointercancel',release,{passive:false});

function step(){
 if(running&&ball){
  const dt=1;
  ball.vy=Math.min(ball.vy+.16,7.5);ball.x+=ball.vx;ball.y+=ball.vy;
  ball.vx*=.996;
  ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x));
  // very small bias toward selected bin; collisions remain the visible motion
  ball.vx+=(targetX(targetBin)-ball.x)*.000045;
  for(const p of pegs){
   const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy),min=ball.r+p.r;
   if(d<min&&d>.001){
    const nx=dx/d,ny=dy/d;ball.x+=nx*(min-d);ball.y+=ny*(min-d);
    const vn=ball.vx*nx+ball.vy*ny;
    if(vn<0){ball.vx-=1.7*vn*nx;ball.vy-=1.7*vn*ny}
    ball.vx+=(Math.random()-.5)*.06;
   }
  }
  const floor=H*.885;
  if(ball.y>floor){ball.y=floor;ball.vy*=.25;if(Math.abs(ball.vy)<.8){running=false;ball.x=targetX(targetBin);ball.y=floor;document.getElementById('resultText').textContent=prizeData[targetBin][0]+' '+prizeData[targetBin][1];document.getElementById('result').style.display='block';
    if(Array.isArray(cfg.stock)&&cfg.stock[targetBin]!==undefined&&Number.isFinite(+cfg.stock[targetBin])&&+cfg.stock[targetBin]>0){cfg.stock[targetBin]=Math.max(0,+cfg.stock[targetBin]-1);localStorage.setItem('plinko_cfg',JSON.stringify(cfg));}
    setTimeout(()=>{document.getElementById('result').style.display='none';standby=true;document.getElementById('standby').style.display='flex';resetBall();},1800);
  }}
 }
 requestAnimationFrame(step);
}
document.getElementById('playBtn').addEventListener('click',()=>{standby=false;document.getElementById('standby').style.display='none';document.getElementById('result').style.display='none';resetBall();});
resize();addEventListener('resize',resize);draw();step();
</script>
</body>
</html>
