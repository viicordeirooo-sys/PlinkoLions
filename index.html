<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PLINKO — Jogo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050403;font-family:Arial,Helvetica,sans-serif}
body{color:#fff}.stage{position:relative;width:100vw;height:100vh;min-height:520px;overflow:hidden;background:
radial-gradient(ellipse at 50% 42%,rgba(95,54,10,.24),transparent 44%),
radial-gradient(ellipse at 50% 100%,rgba(255,159,24,.12),transparent 50%),
linear-gradient(180deg,#070605 0%,#0b0805 55%,#030303 100%)}
.stage:before{content:"";position:absolute;inset:0;background:
linear-gradient(90deg,rgba(255,170,48,.16),transparent 16%,transparent 84%,rgba(255,170,48,.16)),
radial-gradient(circle at 8% 25%,rgba(255,182,58,.22),transparent 10%),
radial-gradient(circle at 92% 25%,rgba(255,182,58,.22),transparent 10%);pointer-events:none}
.curtain{position:absolute;top:-3%;width:15%;height:110%;background:
linear-gradient(90deg,#130103 0%,#5e0613 23%,#ad1020 42%,#4b0410 61%,#100103 100%);
filter:drop-shadow(0 0 18px rgba(255,25,35,.18));z-index:1}
.curtain.left{left:-2%;clip-path:polygon(0 0,100% 0,78% 100%,0 100%)}.curtain.right{right:-2%;transform:scaleX(-1);clip-path:polygon(0 0,100% 0,78% 100%,0 100%)}
.curtain:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(255,90,70,.18) 10% 12%,transparent 13% 23%)}
.sideLight{position:absolute;top:0;width:16%;height:30%;z-index:2;opacity:.95}
.sideLight.left{left:2%;background:radial-gradient(circle at 20% 25%,#ffd16a 0 2%,transparent 3%),radial-gradient(circle at 35% 25%,#ffd16a 0 2%,transparent 3%),radial-gradient(circle at 50% 25%,#ffd16a 0 2%,transparent 3%),radial-gradient(circle at 65% 25%,#ffd16a 0 2%,transparent 3%),radial-gradient(circle at 80% 25%,#ffd16a 0 2%,transparent 3%)}
.sideLight.right{right:2%;background:radial-gradient(circle at 20% 25%,#ffd16a 0 2%,transparent 3%),radial-gradient(circle at 35% 25%,#ffd16a 0 2%,transparent 3%),radial-gradient(circle at 50% 25%,#ffd16a 0 2%,transparent 3%),radial-gradient(circle at 65% 25%,#ffd16a 0 2%,transparent 3%),radial-gradient(circle at 80% 25%,#ffd16a 0 2%,transparent 3%)}
.header{position:absolute;top:2.2%;left:50%;transform:translateX(-50%);z-index:5;text-align:center;white-space:nowrap}
.title{font-weight:1000;letter-spacing:2px;font-size:clamp(48px,6.4vw,106px);line-height:.86;color:#ffd45b;text-shadow:0 2px 0 #7a3f00,0 0 8px #ffb52c,0 0 22px rgba(255,173,35,.55);font-family:Georgia,serif}
.title span{display:inline-block;padding:0 .07em;border:3px solid rgba(255,218,120,.45);border-radius:9px;box-shadow:inset 0 0 18px rgba(255,221,125,.18)}
.subtitle{margin-top:9px;font-size:clamp(15px,1.5vw,26px);font-weight:800;letter-spacing:.7px;color:#ffe3a2;text-shadow:0 0 8px #d78a18}
.sideText{position:absolute;z-index:4;top:10.5%;width:13%;font-size:clamp(12px,1.18vw,22px);font-weight:900;line-height:1.2;text-align:center;color:#f7dda5;text-shadow:0 0 10px #ffad28}
.sideText.l{left:22%}.sideText.r{right:22%}
#game{position:absolute;z-index:3;touch-action:none;display:block}
.hint{position:absolute;z-index:8;bottom:1.1%;left:50%;transform:translateX(-50%);font-size:clamp(10px,.8vw,14px);color:#c9b18a;letter-spacing:1px;text-transform:uppercase;opacity:.9}
.result{position:absolute;z-index:20;left:50%;top:43%;transform:translate(-50%,-50%) scale(.96);min-width:min(520px,80vw);padding:26px 34px;border:2px solid #f2bd45;border-radius:18px;background:linear-gradient(180deg,rgba(22,13,5,.97),rgba(3,3,3,.98));box-shadow:0 0 50px rgba(255,174,45,.4),inset 0 0 30px rgba(255,174,45,.08);text-align:center;opacity:0;pointer-events:none;transition:.25s}
.result.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.result small{color:#d6b47b;text-transform:uppercase;letter-spacing:2px}.result strong{display:block;margin-top:8px;font-size:clamp(28px,3vw,48px);color:#ffd45b}.again{margin-top:18px;border:1px solid #d9a83e;background:#120b03;color:#ffe5a5;border-radius:999px;padding:10px 22px;font-weight:900;cursor:pointer}
@media(max-aspect-ratio:1/1){.sideText{display:none}.header{top:1%}.title{font-size:44px}.subtitle{font-size:12px}.curtain{width:12%}}
</style>
</head>
<body>
<div class="stage">
  <div class="curtain left"></div><div class="curtain right"></div>
  <div class="sideLight left"></div><div class="sideLight right"></div>
  <div class="header"><div class="title"><span>PLINKO</span></div><div class="subtitle">SOLTE A BOLA E DESCUBRA SEU PRÊMIO</div></div>
  <div class="sideText l">GRANDES<br>PRÊMIOS<br>GRANDES<br>EMOÇÕES</div>
  <div class="sideText r">SUA<br>SORTE<br>PODE<br>BRILHAR<br>AGORA</div>
  <canvas id="game"></canvas>
  <div class="hint">Toque e arraste a bola • solte para jogar</div>
  <div class="result" id="result"><small>PRÊMIO SORTEADO</small><strong id="resultName"></strong><button class="again" id="again">JOGAR NOVAMENTE</button></div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const result=document.getElementById('result'),resultName=document.getElementById('resultName'),again=document.getElementById('again');
const prizes=[
 {name:'R$ 100 FICHAS',icon:'chips',color:'#e73531'},
 {name:'R$ 200 FICHAS',icon:'chips',color:'#d9a52c'},
 {name:'R$ 500 FICHAS',icon:'chips',color:'#e8d55b'},
 {name:'R$ 1.000 FICHAS',icon:'chips',color:'#3bdc77'},
 {name:'R$ 2.000 FICHAS',icon:'chips',color:'#27b9f2'},
 {name:'R$ 5.000 FICHAS',icon:'chips',color:'#24b9ff'},
 {name:'iPad',icon:'ipad',color:'#a948ff'},
 {name:'iPhone 17 Pro Max',icon:'phone',color:'#ef46c9'},
 {name:'Bicicleta Elétrica',icon:'bike',color:'#ffd34e'},
 {name:'Barra de Ouro',icon:'gold',color:'#f4c441'},
 {name:'10 CUPONS CARRO',icon:'car',color:'#ef3030'},
 {name:'15 CUPONS CARRO',icon:'car',color:'#ef3030'},
 {name:'20 CUPONS CARRO',icon:'car',color:'#ef3030'}
];
let cfg={weights:prizes.map((_,i)=>[12,10,7,5,4,3,2,1.5,1.2,.8,3,2,1][i]),active:prizes.map(()=>true),stock:prizes.map(()=>999)};
try{const s=JSON.parse(localStorage.getItem('plinko_cfg'));if(s)cfg=Object.assign(cfg,s)}catch(e){}
let W=1536,H=864,dpr=1,board={x:220,y:156,w:1096,h:690},pegs=[],ball=null,running=false,drag=false,last=0,targetBin=null;
function resize(){
 dpr=Math.min(2,devicePixelRatio||1); W=1536; H=864;
 canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
 canvas.style.position='absolute';
 canvas.style.left='50%'; canvas.style.top='50%';
 canvas.style.width=W+'px'; canvas.style.height=H+'px';
 const scale=Math.max(innerWidth/W,innerHeight/H);
 canvas.style.transform=`translate(-50%,-50%) scale(${scale})`;
 canvas.style.transformOrigin='center center';
 ctx.setTransform(dpr,0,0,dpr,0,0);
 build();
}
function build(){
 board={x:165,y:157,w:1205,h:690}; pegs=[];
 const rows=12, topY=258, bottomY=646;
 for(let r=0;r<rows;r++){
   const t=r/(rows-1), half=92 + t*438, n=6+r;
   const gap=(half*2)/(n-1);
   for(let i=0;i<n;i++) pegs.push({x:W/2-half+i*gap,y:topY+t*(bottomY-topY),r:6.5});
 }
}
function polyPath(){
 const x=board.x,y=board.y,w=board.w,h=board.h;
 ctx.beginPath();ctx.moveTo(W/2,y);ctx.lineTo(x+w*.94,y+h*.99);ctx.lineTo(x+w*.06,y+h*.99);ctx.closePath();
}
function drawFrame(){
 // black triangular playfield
 const x=board.x,y=board.y,w=board.w,h=board.h;
 ctx.save();polyPath();ctx.fillStyle='#060606';ctx.fill();ctx.strokeStyle='#d9962b';ctx.lineWidth=12;ctx.shadowColor='#ffb52d';ctx.shadowBlur=20;ctx.stroke();ctx.shadowBlur=0;
 // inner gold line
 ctx.strokeStyle='#ffe08a';ctx.lineWidth=2;ctx.stroke();
 // marquee bulbs along slanted edges
 for(let side of [-1,1]) for(let i=0;i<22;i++){
   const t=i/21, px=W/2+side*(55+t*(w*.44)), py=y+14+t*(h*.86);
   ctx.beginPath();ctx.arc(px,py,4.2,0,Math.PI*2);ctx.fillStyle='#ffd45b';ctx.shadowColor='#ffb52d';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
 }
 ctx.restore();
}
function drawPegs(){
 for(const p of pegs){
   const g=ctx.createRadialGradient(p.x-2,p.y-3,1,p.x,p.y,9);g.addColorStop(0,'#fff2b0');g.addColorStop(.25,'#f6c84f');g.addColorStop(.7,'#a76408');g.addColorStop(1,'#4b2500');
   ctx.beginPath();ctx.arc(p.x,p.y,p.r+2,0,Math.PI*2);ctx.fillStyle='rgba(255,174,36,.13)';ctx.fill();
   ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=g;ctx.shadowColor='#ffb52b';ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
 }
}
function drawArrows(){
 for(const x of [W/2-92,W/2,W/2+92]){
  ctx.save();ctx.strokeStyle='#ff3434';ctx.lineWidth=5;ctx.shadowColor='#ff2020';ctx.shadowBlur=18;
  ctx.beginPath();ctx.moveTo(x-22,176);ctx.lineTo(x,198);ctx.lineTo(x+22,176);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-22,188);ctx.lineTo(x,210);ctx.lineTo(x+22,188);ctx.stroke();ctx.restore();
 }
}
function drawPrizeIcon(p,x,y,w,h){
 ctx.save();ctx.translate(x,y);ctx.shadowColor=p.color;ctx.shadowBlur=18;
 ctx.fillStyle=p.color;ctx.strokeStyle='#fff0a5';ctx.lineWidth=1.2;
 if(p.icon==='chips'){
   for(let i=-1;i<=1;i++){ctx.beginPath();ctx.ellipse(i*10,2,10,5,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(i*10,-5,10,5,0,0,Math.PI*2);ctx.fill();ctx.stroke()}
 }else if(p.icon==='ipad'){ctx.fillRect(-16,-25,32,50);ctx.fillStyle='#171717';ctx.fillRect(-13,-21,26,42);ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(0,22,1.5,0,7);ctx.fill()}
 else if(p.icon==='phone'){ctx.fillRect(-12,-27,24,54);ctx.fillStyle='#1a1a1a';ctx.fillRect(-9,-23,18,46);ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,-18,3,0,7);ctx.fill()}
 else if(p.icon==='bike'){ctx.strokeStyle=p.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(-18,12,13,0,7);ctx.stroke();ctx.beginPath();ctx.arc(18,12,13,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(-18,12);ctx.lineTo(-3,-4);ctx.lineTo(10,12);ctx.lineTo(-18,12);ctx.lineTo(-3,-4);ctx.lineTo(3,-15);ctx.lineTo(12,-15);ctx.moveTo(3,-15);ctx.lineTo(10,12);ctx.stroke()}
 else if(p.icon==='gold'){ctx.rotate(-.18);ctx.fillRect(-19,-11,38,22);ctx.fillStyle='#fff1a0';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText('GOLD',0,4)}
 else {ctx.fillStyle='#d8d8d8';ctx.fillRect(-24,-12,48,22);ctx.fillStyle='#ef3030';ctx.beginPath();ctx.arc(-14,12,7,0,7);ctx.arc(14,12,7,0,7);ctx.fill();ctx.fillStyle='#9d0d12';ctx.fillRect(-18,-7,36,12)}
 ctx.restore();
}
function drawBins(){
 const n=prizes.length, left=170,right=1366, y=675,h=170, gap=2, bw=(right-left-gap*(n-1))/n;
 for(let i=0;i<n;i++){
   const x=left+i*(bw+gap),p=prizes[i];
   ctx.save();
   const grd=ctx.createLinearGradient(0,y,0,y+h);grd.addColorStop(0,'#14100c');grd.addColorStop(.15,p.color+'35');grd.addColorStop(.55,'#080808');grd.addColorStop(1,'#020202');
   ctx.fillStyle=grd;ctx.fillRect(x,y,bw,h);
   ctx.strokeStyle='#8f692c';ctx.lineWidth=1.4;ctx.strokeRect(x,y,bw,h);
   ctx.shadowColor=p.color;ctx.shadowBlur=18;ctx.strokeStyle=p.color+'77';ctx.strokeRect(x+2,y+2,bw-4,h-4);ctx.shadowBlur=0;
   drawPrizeIcon(p,x+bw/2,y+45,bw,70);
   ctx.fillStyle='#fff7dc';ctx.textAlign='center';ctx.font=`900 ${Math.max(10,Math.min(15,bw/5))}px Arial`;
   const lines=p.name.split(' '); let line='',arr=[];
   for(const word of lines){if((line+' '+word).trim().length>14){arr.push(line.trim());line=word}else line+=' '+word} if(line.trim())arr.push(line.trim());
   arr.slice(0,3).forEach((ln,j)=>ctx.fillText(ln,x+bw/2,y+113+j*17));
   ctx.restore();
 }
}
function drawBall(){
 if(!ball)return;
 const g=ctx.createRadialGradient(ball.x-5,ball.y-6,1,ball.x,ball.y,17);g.addColorStop(0,'#fff');g.addColorStop(.35,'#eee');g.addColorStop(.75,'#aaa');g.addColorStop(1,'#555');
 ctx.beginPath();ctx.arc(ball.x,ball.y,15,0,7);ctx.fillStyle='rgba(255,255,255,.12)';ctx.fill();
 ctx.beginPath();ctx.arc(ball.x,ball.y,12,0,7);ctx.fillStyle=g;ctx.shadowColor='#fff';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
}
function render(){
 ctx.clearRect(0,0,W,H);drawFrame();drawArrows();drawPegs();drawBins();drawBall();
 requestAnimationFrame(render);
}
function getPointer(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)}}
function nearestBin(x){let left=170,right=1366;return Math.max(0,Math.min(prizes.length-1,Math.floor((x-left)/((right-left)/prizes.length))))}
function weightedTarget(){
 const available=prizes.map((p,i)=>cfg.active[i]&&cfg.weights[i]>0&&((cfg.stock?.[i] ?? 999)>0)?cfg.weights[i]:0);let sum=available.reduce((a,b)=>a+b,0);if(!sum)return 0;
 let r=Math.random()*sum;for(let i=0;i<available.length;i++){r-=available[i];if(r<=0)return i}return 0;
}
function targetX(bin){const left=170,right=1366;return left+(bin+.5)*(right-left)/prizes.length}
function startBall(x){
 targetBin=weightedTarget();const tx=targetX(targetBin);
 ball={x:Math.max(260,Math.min(1276,x)),y:222,vx:(tx-x)*.017,vy:1.2,r:12,tx};running=true;result.classList.remove('show');
}
function physics(dt){
 if(!running||!ball)return;
 const step=dt/4;
 for(let k=0;k<4;k++){
  ball.vy+=0.19; ball.x+=ball.vx;ball.y+=ball.vy;
  // target-seeking force is intentionally tiny and acts only as a probability-control bias
  const dy=Math.max(1,ball.y-220), pull=Math.max(-.06,Math.min(.06,(ball.tx-ball.x)/520));
  ball.vx+=pull;ball.vx*=.994;
  for(const p of pegs){
    const dx=ball.x-p.x,dy2=ball.y-p.y,d=Math.hypot(dx,dy2),min=ball.r+p.r;
    if(d<min && d>0){
      const nx=dx/d,ny=dy2/d,over=min-d;ball.x+=nx*over;ball.y+=ny*over;
      const vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){ball.vx-=1.65*vn*nx;ball.vy-=1.65*vn*ny}
      ball.vx+=nx*.28+(Math.random()-.5)*.13;ball.vy*=.94;
    }
  }
  const floor=652;if(ball.y>floor){ball.y=floor;ball.vy=Math.abs(ball.vy)*.25;if(Math.abs(ball.vy)<1.1){finish();return}}
  if(ball.x<205){ball.x=205;ball.vx=Math.abs(ball.vx)*.6} if(ball.x>1331){ball.x=1331;ball.vx=-Math.abs(ball.vx)*.6}
 }
}
function finish(){running=false;ball.x=targetX(targetBin);ball.y=653; if(Array.isArray(cfg.stock) && cfg.stock[targetBin] !== undefined && cfg.stock[targetBin] > 0){cfg.stock[targetBin]--;localStorage.setItem('plinko_cfg',JSON.stringify(cfg));} resultName.textContent=prizes[targetBin].name;result.classList.add('show')}
canvas.addEventListener('pointerdown',e=>{if(running)return;canvas.setPointerCapture(e.pointerId);drag=true;const p=getPointer(e);ball={x:Math.max(250,Math.min(1286,p.x)),y:222,vx:0,vy:0,r:12};});
canvas.addEventListener('pointermove',e=>{if(!drag||running)return;const p=getPointer(e);ball.x=Math.max(245,Math.min(1291,p.x));});
canvas.addEventListener('pointerup',e=>{if(!drag||running)return;drag=false;startBall(ball.x)});
again.onclick=()=>{result.classList.remove('show');ball=null};
setInterval(()=>{if(running)physics(16)},16);
resize();addEventListener('resize',resize);render();
</script>
</body></html>
